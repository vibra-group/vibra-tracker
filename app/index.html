*{box-sizing:border-box}

.cols{display:flex;align-items:flex-start;gap:24px}

.tipbox{position:absolute;z-index:30;top:calc(100% + 2px);left:-6px;width:280px;max-width:76vw;padding:10px 12px;border-radius:var(--r-sm);background:#1A1D24;color:#F2F2EE;font:400 12.5px/1.5 var(--sans);letter-spacing:0;text-transform:none;box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(-3px);transition:opacity .15s,transform .2s var(--ease),visibility .15s;pointer-events:none}
.tip.r .tipbox{left:auto;right:-6px}
@media (hover:hover){.tip:hover .tipbox{opacity:1;visibility:visible;transform:none}}
.tip.open .tipbox{opacity:1;visibility:visible;transform:none}

/* popovers */
.pop{position:fixed;top:calc(var(--hdr-h) + 8px);right:max(16px,env(safe-area-inset-right));z-index:70;width:400px;max-height:calc(100vh - var(--hdr-h) - 24px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);animation:popIn .2s var(--ease) both;transform-origin:top right}
.pop-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.nitem{display:flex;gap:10px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;transition:background .15s}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--accent-soft)}
.ndot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:none;margin-top:6px}
.nitem:not(.unread) .ndot{visibility:hidden}
.menu{width:300px;padding:6px}
.mi{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.mi:hover{background:var(--surface-2)}
.mi small{color:var(--muted);font-size:12px}
@media (max-width:600px){.pop{left:12px;right:12px;width:auto}}

/* dialogs, toast */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(14,17,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px;overflow-y:auto;animation:fade .2s ease both}
.dialog{width:100%;max-width:620px;margin:auto;background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);padding:24px;display:flex;flex-direction:column;gap:14px;animation:dlgIn .32s var(--ease) both}
.dialog h2{margin:0;font:650 22px/1.2 var(--sans);letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:8px;max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 16px;border-radius:var(--r);background:#1A1D24;color:#F2F2EE;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:toastIn .35s var(--ease) both;transform:translateX(-50%)}
.toast .ibtn{background:transparent;border-color:transparent;color:inherit;width:34px;height:34px}
.toast.err{background:#7A1E12}
.tour-art{height:120px;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 20px}
.dots{display:flex;gap:6px}
.dots i{display:block;height:8px;width:8px;border-radius:999px;background:var(--line-2);transition:width .3s var(--ease),background .3s}
.dots i.on{width:22px;background:var(--accent)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;align-items:start;margin-top:18px}

/* 0.1.1 charts: categorical steps validated with the dataviz validator (light on #fff, dark on #151920); see SPEC §5.5 */
:root{--c-dl:#e34948;--c-action:#2a78d6;--c-drafting:#1baf7a;--c-chase:#6250d6;--c-waiting:#b4b2ab;--c-dot:#2a78d6;--c-stale:#ec835a;--grid:#ecebe7;--axis:#cfcdc6}
:root[data-theme="dark"]{--c-dl:#e66767;--c-action:#3987e5;--c-drafting:#199e70;--c-chase:#9085e9;--c-waiting:#4b525d;--c-dot:#3987e5;--c-stale:#ec835a;--grid:#212833;--axis:#343c49}
.dsec{margin-top:36px}

.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
button.kpi:hover:not([disabled]){transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-2)}
.kpi[disabled]{cursor:default;opacity:.55}
.kpi .v{font:650 32px/1 var(--sans);letter-spacing:-.02em}
.kpi .l{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .s{font-size:12px;color:var(--muted)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:999px;flex:none}
.sdot.s-crit{background:#d03b3b}.sdot.s-warn{background:#fab219}.sdot.s-serious{background:#ec835a}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.alist{margin-top:14px;overflow:hidden}
.arow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.arow-main{flex:1;min-width:0;display:grid;grid-template-columns:150px minmax(0,2.4fr) minmax(0,1.2fr) 190px;gap:14px;align-items:center;padding:12px 8px 12px 16px;border:0;background:none;text-align:left;cursor:pointer;transition:background .15s}
.arow-main:hover{background:var(--surface-2)}
.arow .t{display:block;font-weight:550}.arow .j{display:block;font-size:12px}
.arow .who{font-size:13px;color:var(--ink-2)}.arow .am{font-size:12px;text-align:right}
.ibtn.sm{width:34px;height:34px;margin-right:10px;flex:none}
.amore{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;font-size:13px}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.stg{position:relative;display:flex;flex-direction:column;gap:3px;padding:16px 14px 16px 22px;border-left:1px solid var(--line);min-width:0}
.stg:first-child{border-left:0;padding-left:18px;border-radius:var(--r) 0 0 var(--r)}
.stg:last-child{border-radius:0 var(--r) var(--r) 0}
.stg::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg)}
.stg:first-child::before{display:none}
.stg.done,.stg.done::before{background:var(--surface-2)}
.stg .n{font:650 28px/1.05 var(--sans);letter-spacing:-.02em}
.stg .sl{font-weight:600;font-size:13px}
.stg .ss{font-size:12px;color:var(--muted)}
.stg .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.flowx{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.flowx b{color:var(--ink)}
.chart{margin-top:14px;padding:16px 20px 12px}
.chart h3{margin:0;font:600 14px var(--sans)}
.chart .cq{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.sp-row{display:grid;grid-template-columns:160px minmax(0,1fr) 64px;gap:14px;align-items:center;border-top:1px solid var(--grid)}
.sp-row:first-child{border-top:0}
.sp-l{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.sp-trk{position:relative;min-height:34px}
.sp-g{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.sp-90{position:absolute;top:0;bottom:0;border-left:1px solid var(--axis)}
.sp-r{font-size:11.5px;text-align:right}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;padding:0;border:0;border-radius:999px;background:var(--c-dot);box-shadow:0 0 0 2px var(--surface);cursor:pointer;transition:transform .15s var(--ease);animation:tagIn .4s var(--ease) both}
.dot::before{content:"";position:absolute;inset:-7px;border-radius:999px}
.dot.stale{background:var(--c-stale)}
.dot:hover,.dot:focus-visible{transform:scale(1.35);outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink-2)}
.sp-axis{border-top:1px solid var(--axis)}
.sp-axis .sp-trk{min-height:22px}
.sp-t{position:absolute;top:4px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.sp-t.first{transform:none}
.sp-t.hl{color:var(--ink);font-weight:600}
.out{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:12px;align-items:stretch}
.out .kpis{align-content:stretch}
.hero{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px 24px}
.hero .hv{font:650 56px/1 var(--sans);letter-spacing:-.03em}
.hero .hl{font-weight:600;font-size:15px}
.hero .hs{font-size:13px;color:var(--muted)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px;margin-top:12px;align-items:start}
.olist .orow{display:grid;grid-template-columns:78px 92px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:9px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:13px;border-radius:0}
.olist .orow:hover{background:var(--surface-2)}
.hb{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 30px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.hb .trk{height:14px;position:relative}
.hb .fill{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--c-action);transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.hb .v{font:600 12.5px var(--sans);text-align:right}
.wk{padding:6px 20px 14px}
.wk-row{display:grid;grid-template-columns:150px minmax(0,1fr) 34px 100px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--grid);font-size:13px}
.wk-row:first-child{border-top:0}
.wk-trk{min-width:0}
.wk-bar{display:flex;gap:2px;height:16px;border-radius:0 4px 4px 0;overflow:hidden;transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.wk-bar .seg{display:block;height:100%;min-width:4px}
.wk-t{font-weight:600;text-align:right}
.wk-a{font-size:12px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:10px}
.lg .sw{border-radius:3px}
.swd{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
#vtip{position:fixed;left:0;top:0;z-index:95;max-width:300px;padding:8px 10px;border-radius:var(--r-sm);background:#1A1D24;color:#C9CCD2;font:400 12px/1.45 var(--sans);box-shadow:0 10px 28px rgba(0,0,0,.25);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .15s var(--ease)}
#vtip.on{opacity:1;transform:none}
#vtip b{display:block;color:#F2F2EE;font-weight:600;font-size:13px}
@media (max-width:860px){
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stg:nth-child(5){border-left:0}
  .stg:nth-child(n+5){border-top:1px solid var(--line)}
  .stg:nth-child(5)::before{display:none}
  .stg:first-child,.stg:last-child{border-radius:0}
  .out{grid-template-columns:1fr}
  .arow-main{grid-template-columns:minmax(0,1fr);gap:4px}
  .arow .am{text-align:left}
  .sp-row{grid-template-columns:104px minmax(0,1fr) 40px;gap:8px}
  .wk-row{grid-template-columns:96px minmax(0,1fr) 28px}
  .wk-a{grid-column:2/-1;margin-top:-6px}
}
/* reminders, permissions, requests */
.rem{margin-top:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
.pact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.setrow.off>div,.setrow.off>.btn,.setrow.off>.switch{opacity:.5}
.setrow.off .btn,.setrow.off .switch{cursor:not-allowed}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.ritem .rm{display:flex;gap:2px;flex-wrap:wrap;align-items:center}

.perm .ok{color:var(--ok-fg)}.perm .no{color:var(--muted)}
/* quick update + feedback dialogs, AI desk */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:12px;border:1.5px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:13px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:96px;height:72px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);animation:tagIn .25s var(--ease) both}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seg3{display:flex;gap:6px}
.desk-item{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.desk-item img{max-width:100%;border-radius:var(--r-sm);border:1px solid var(--line)}
.desk-pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono);background:var(--surface-2);padding:12px;border-radius:var(--r-sm);max-height:480px;overflow:auto}

@keyframes fxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tagIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== 0.1.1 visual system =====
   Design read: daily work tool for a small clinical research group; calm "soft structuralism":
   cool silver-grey canvas, one navy accent, Geist + Phosphor Light icons, double-bezel cards,
   floating glass header, pill buttons, restrained spring motion. Dials: variance 4, motion 5, density 6.
   Shape lock: buttons and tags are pills, cards 16px (tray 22px), inputs 10px. */
:root{
  --bg:#F1F2F4;--surface:#FFFFFF;--surface-2:#F5F6F8;--line:rgba(16,24,40,.08);--line-2:rgba(16,24,40,.15);
  --ink:#0F1420;--ink-2:#394150;--muted:#626B7A;
  --accent:#17407F;--accent-fg:#FFFFFF;--accent-text:#17407F;--accent-soft:#E9EFF8;--accent-line:#A9BEDF;
  --shell:rgba(16,24,40,.035);--shell-ring:rgba(16,24,40,.055);--hi:inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-1:0 1px 2px rgba(16,24,40,.04),0 2px 6px -2px rgba(16,24,40,.05);
  --shadow-2:0 2px 4px rgba(16,24,40,.04),0 28px 56px -28px rgba(16,24,40,.28);
  --bezel:0 0 0 1px var(--line),0 0 0 6px var(--shell),0 0 0 7px var(--shell-ring),var(--hi),var(--shadow-1);
  --bezel-2:0 0 0 1px var(--line),0 0 0 6px var(--shell),0 0 0 7px var(--shell-ring),var(--hi),var(--shadow-2);
  --ease:cubic-bezier(.32,.72,0,1);--r:16px;--r-sm:10px;--glass:rgba(255,255,255,.74);
  --code:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;--mono:var(--sans);
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A0C10;--surface:#12151B;--surface-2:#191D25;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --ink:#ECEEF2;--ink-2:#C2C7D0;--muted:#8D95A3;
  --accent:#3F6FCC;--accent-fg:#FFFFFF;--accent-text:#A9C2F2;--accent-soft:#18233A;--accent-line:#34507F;
  --shell:rgba(255,255,255,.025);--shell-ring:rgba(255,255,255,.05);--hi:inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-2:0 2px 4px rgba(0,0,0,.35),0 30px 60px -30px rgba(0,0,0,.8);
  --glass:rgba(18,21,27,.72);
}
body{background:var(--bg);font-feature-settings:"ss01","cv11";letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70rem 36rem at 8% -12%,rgba(23,64,127,.09),transparent 62%),radial-gradient(56rem 30rem at 102% -6%,rgba(27,175,122,.06),transparent 60%)}
:root[data-theme="dark"] body::before{background:radial-gradient(70rem 36rem at 8% -12%,rgba(63,111,204,.16),transparent 62%),radial-gradient(56rem 30rem at 102% -6%,rgba(25,158,112,.08),transparent 60%)}
svg.ic{width:18px;height:18px;flex:none;fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:10px}

/* floating island header */
.hdr{top:10px;width:calc(100% - 24px);max-width:1376px;margin:10px auto 0;border:0;border-radius:22px;background:var(--glass);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);box-shadow:0 0 0 1px var(--line),var(--hi),0 18px 40px -26px rgba(16,24,40,.35)}
.hdr-in{padding:8px 10px 8px 18px}
.brand b{font:700 19px/1 var(--sans);letter-spacing:.06em}
.ver{font:500 11px/1 var(--sans);padding:5px 9px;background:var(--accent-soft);color:var(--accent-text)}
.tabs{gap:2px;padding:4px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tab{padding:7px 12px;border-radius:999px;font-size:13.5px;transition:color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.tab:hover{background:transparent;color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(16,24,40,.08)}
.tab[aria-current="page"]::after{display:none}
.search input{height:38px;border-radius:999px;border-color:var(--line);background:var(--surface-2);padding-left:36px;transition:background .2s var(--ease),box-shadow .2s var(--ease)}

:root{

  urgency: 'Set automatically. Due: a deadline within 7 days or overdue, or the journal sent it back to us and is waiting (stage Returned to authors). Deadline: a later deadline. Our move: the group must act (ready to submit, internal review, co-authors confirming, reviews back, a revision). Chase journal: at a journal with no news for over 90 days. Waiting: the journal or editor has it. Click a tile to jump to its list.',
  status: 'Where the manuscript is: Drafting, Internal review, Ready to Submit, Submitted, Under Review, Accepted, Published or Rejected. Published and Rejected close the manuscript.',
  stage: 'Only for Submitted and Under Review: where it stands at the journal, for example With editor, Review R1 or Revising. Returned to authors: the journal asked us for something (a checklist, forms, files, resume the submission); it then shows as Due until it is done. Authors confirming: co-authors still have to confirm on the journal site; it shows as Our move.',
  deadline: 'A real date set by the journal or by GV. Whoever has the ball sees it on Today and gets an alert 7 days and 1 day before.',
  ball: 'The people who must act next (not the authors). Click a tag to add a short note such as corr. or submitting, or to make it primary: the primary person gets the alerts. Click the box below to pick a member, or type any other name to add a guest tag (no notifications).',
  next: 'What has to happen next, as a numbered list. Press Enter and the next number appears; Enter on an empty number ends the list; Shift+Enter adds a line break.',
  authors: 'The author list in submission order; the first tag is the first author. Each author is one person in the Authors list, shown with the full name on file however it was written (point at a tag to see how it was written). A tag with ? is not settled yet: the admin confirms it in the AI desk. Click a tag to add a note, mark the corresponding author or move it.',
  note: 'Adds a dated line to this manuscript\'s history, visible to everyone. Use it for facts: a mail received, a decision, a file sent.',
  notif: 'Choose which events put a notification under your bell. They are yours only.',
  roles: 'Admin: adds members and changes roles. Editor: creates and updates manuscripts. Viewer: reads and exports only. A member also needs the Google Sheet shared with them.',
  dashc: 'Choose which blocks you see, in which order, and whether the dashboard shows the whole group or only the manuscripts you are on. Saved for you only.',
  xl: 'Every cell this manuscript had in the Excel workbook (Manuscripts_tracker.xlsx) when the app was set up, kept read-only so nothing is lost. The fields above are the live ones.',
  lst: 'All: every manuscript ever tracked. In progress: something is still to do (an accepted paper with proofs pending counts here). Accepted, Published, Rejected: by status, kept for the record.',
  aroles: 'The corresponding author and the first author of the paper, from the author tags (click a tag to mark it corresponding) and the First author field. "Ball is with" is different: the person who must act next, which is often somebody else.',
  live: 'While the app is open (also in a background tab) it checks for news every minute: new items appear under the bell with a short message, and a soft sound plays when someone passes you the ball. Pop-up notifications from the browser are not possible here: Google runs these apps in a protected frame that blocks them. For alerts on your phone or computer, install the VIBRA app (Settings, Notifications).',
  remind: 'A private reminder, for you only. Pick a date and time: Google Calendar opens in a new tab with the event filled in and you press Save (or download an .ics file for Apple or Outlook). Your calendar sends the alert. Tick the box to also see it under the bell that day. No extra Google permission is needed.',
  calfile: 'One calendar file with the deadlines of every open manuscript where you are tagged (ball or author). Open it to import them into Google, Apple or Outlook calendar. It is a snapshot: download it again after deadlines change.',
  feed: 'A private calendar address that your calendar app subscribes to: the deadlines appear as all-day events and move by themselves when a deadline changes, with no file to download again. Google Calendar refreshes subscribed calendars on its own schedule, sometimes only once a day; Apple Calendar and Outlook let you choose how often. Keep the address to yourself: anyone who has it sees these deadlines (titles, journal, ball, next actions). Make a new link if it was shared by mistake: the old one stops at once. It gives no access to the app or the database.',
  mailrem: 'Your reminders are private: they are kept in your own Google account, not in the shared database, so they are not sent by e-mail. Add a reminder to your calendar with the calendar button and your calendar alerts you, by e-mail too if you set it so.',
  digest: 'A short e-mail every Monday at 07:00 (Vietnam time): the manuscripts that wait on you, what is due or overdue, deadlines in the next three weeks and journals to chase. It is sent from the admin\'s helper with the sender name VIBRA Tracker. The admin tries it alone first, then opens it to everyone; you can switch it off for yourself at any time.',
  dlalert: 'A notification under the bell (and on your phone if you paired the VIBRA app) 7 days and 1 day before a deadline, when you have the ball. Sent at 07:00 Vietnam time.',
  permweb: 'You sign in with Google on the group\'s own page. Google tells the app only your name and e-mail address; the app gets no permission on your Google account. Sign out on this device in Settings, General. You can also remove the sign-in in your Google account at any time.',
  perm: 'Google asked you for these two permissions the first time you opened the app. They cover only this database and your e-mail address. You can remove the access at any time in your Google account; the app then asks again next time.',
  requests: 'What you sent with Quick update or Feedback, and what happened to it. With the AI helper switched on, a quick update is applied within about a minute; anything that needs a closer look, and everything when the helper is off, is applied by the 06:00 check (Vietnam time).',
  pwa: 'The VIBRA app is a small page you install once (it lives on GitHub Pages and holds no group data). It opens this tracker, shows your own manuscripts when you are offline, and receives notifications. To pair a device, get a one-time code here and type it in the app. Turn notifications off in the app at any time.',
  auexp: 'An Excel file to fill in a journal submission quickly: every author in order with full name, given and family name, role (first, equal contribution, corresponding), numbered affiliations, e-mails and ORCID, plus a title page with the author line and affiliations. Details come from the Authors tab of the Sheet; anything missing is listed under To check. The file holds personal details: share it only for the submission.',
  att: 'Built from deadlines, journals silent for over 90 days, manuscripts ready but not yet submitted, and manuscripts where a guest holds the ball. Click a number to filter the list; the calendar button sets a private reminder.',
  strip: 'Days since the last recorded update of each open manuscript, grouped by status. A dot far to the right means nobody has logged news for a long time: a journal to chase or a draft that stalled. Hover or focus a dot for the title; click to open it. Manuscripts without any date are counted on the right.',
  turn: 'From the submission date to the latest recorded update (usually the decision or publication). Only manuscripts with both dates count, so treat it as a rough guide.',
  wk: 'Each bar counts the open manuscripts where the person is the primary ball holder, split by urgency. "Author on" counts open manuscripts where the person is in the author list.',
  desk: 'The morning routine pastes a JSON batch here. Rule: newer information wins, so a field a person edited after the evidence time is skipped and reported. Inbox and feedback items listed in the batch are closed and their senders notified.'
};

/* On narrow screens an open tip is pinned to the screen width under its "i", so it never pushes the page sideways. */
function placeTip() {
  var ob = document.querySelector('.tip.open .tipbox'); if (!ob) return;
  if (!(window.matchMedia && window.matchMedia('(max-width:600px), (hover:none)').matches)) return;
  var bt = ob.parentNode.querySelector('.tipb').getBoundingClientRect();
  var top = Math.round(bt.bottom + 6), W = document.documentElement.clientWidth;
  ob.style.cssText = 'position:fixed;left:16px;width:' + (W - 32) + 'px;max-width:none;top:' + top + 'px';
  // an animated ancestor can become the containing block: correct by the measured offset
  var r = ob.getBoundingClientRect();
  if (Math.abs(r.left - 16) > 1 || Math.abs(r.top - top) > 1) { ob.style.left = (16 - (r.left - 16)) + 'px'; ob.style.top = (top - (r.top - top)) + 'px'; }
}

function fold(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').toLowerCase(); }

function shrink(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 450000 && q > 0.45) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      while (out.length > 600000 && c.width > 400) { var c2 = document.createElement('canvas'); c2.width = Math.round(c.width * 0.75); c2.height = Math.round(c.height * 0.75); c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height); c = c2; out = c.toDataURL('image/jpeg', 0.6); }
      res(out);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('unreadable')); };
    img.src = url;
  });
}

/* Instant Quick update: the browser hands the saved item to the admin's helper (Gemini). If that fails, the helper's
   5-minute timer or the 06:00 check applies it anyway; nothing is lost because the item is already saved. */
function runHelper(h, id) {
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 120000);
  fetch(h.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: h.token, id: id }),
    credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (res) { return res.json(); })
    .then(function (r) { clearTimeout(timer); helperDone(r); })
    .catch(function () { clearTimeout(timer); helperDone({ ok: false, queued: true }); });
}
function fieldVal(f) {
  if (f.field === 'next_actions') return '';

}

  var st = r.status;
  if (st === 'applied' && r.applied && r.applied.length) return 'Done. ' + r.applied.map(function (a) {
    var parts = a.fields.map(function (f) { return f.label + fieldVal(f); });
    if (a.note) parts.push('note added');
    return '#' + a.id + ' updated: ' + parts.join(', ');
  }).join('; ') + '. You can undo any of it from the history.';
  if (st === 'for_routine') return r.reply || 'Received. This one needs a closer look, so the 06:00 check will handle it.';
  if (st === 'unclear') return 'The AI needs one more detail: ' + (r.reply || 'which manuscript is it about?') + ' Send another quick update.';
  if (st === 'no_change') return r.reply || 'Nothing to change: the tracker already says that.';
  return r.reply || 'Your quick update was handled.';
}

function makeDraft(m) {

    people: clone(m.people || []), next: m.next || '', authors: clone(m.authors || []), ms_id: m.ms_id || '', doi: m.doi || '', submission_date: m.submission_date || '',
    impact_factor: m.impact_factor || '', first_author: m.first_author || '', orig: null };
  d.orig = JSON.stringify(draftPatch(d));

}
function openDraft(m) { S.draft = makeDraft(m); S.ed = null; S.cb = null; S.confirmClose = false; }
/* Someone saved the manuscript while I had unsaved changes: fields I did not touch take their new values, fields I
   changed keep mine. Returns true when we both changed the same field (then nothing is moved if onlyIfClean). */
var DRAFT_F = ['title', 'type', 'journal', 'status', 'stage', 'deadline', 'people', 'next', 'authors', 'ms_id', 'doi', 'submission_date', 'impact_factor', 'first_author'];
var DRAFT_PK = { people: 'people_json', next: 'next_actions', authors: 'authors_json' };
function rebaseDraft(row, onlyIfClean) {
  var d = S.draft, fresh = makeDraft(row), orig = JSON.parse(d.orig), clash = false, take = [];
  DRAFT_F.forEach(function (f) {
    var o = JSON.stringify(orig[DRAFT_PK[f] || f]), mine = JSON.stringify(d[f]), theirs = JSON.stringify(fresh[f]);
    if (mine === o) take.push(f); else if (theirs !== o && theirs !== mine) clash = true;
  });
  if (clash && onlyIfClean) return true;
  take.forEach(function (f) { d[f] = clone(fresh[f]); });
  d.orig = fresh.orig; d.base = fresh.base;
  return clash;
}

    authors_json: d.authors, ms_id: d.ms_id, doi: d.doi, submission_date: d.submission_date, impact_factor: d.impact_factor, first_author: d.first_author };
}
