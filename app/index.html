.tbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;min-width:960px;font-size:calc(13px*var(--fz,1))}
th{position:sticky;top:0;text-align:left;padding:10px 14px;background:var(--surface-2);font:500 calc(11px*var(--fz,1)) var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr[aria-current="true"]{background:var(--accent-soft)}

/* dashboard */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px;align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font:600 calc(15px*var(--fz,1)) var(--sans)}
.brow{display:grid;grid-template-columns:minmax(100px,140px) minmax(0,1fr) 40px;gap:12px;align-items:center;padding:4px 0;font-size:calc(13px*var(--fz,1))}
.btrk{position:relative;height:12px}
.bfill{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--accent);transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.bval{font:500 calc(12px*var(--fz,1)) var(--mono);text-align:right}
.bref{position:absolute;top:-4px;bottom:-4px;border-left:1.5px dashed var(--ink-2)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 12px;align-items:center;width:100%;padding:8px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer;transition:background .15s}
.srow:hover{background:var(--surface-2)}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:calc(12px*var(--fz,1));color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* details panel */
.panel{scroll-padding-top:64px;scroll-padding-bottom:96px;flex:0 0 440px;position:sticky;top:calc(var(--hdr-h) + 16px);max-height:calc(100vh - var(--hdr-h) - 32px);overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);padding:0 20px 24px}
.panel.fx-panel{animation:panelIn .38s var(--ease) both}
.p-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin:0 -20px;padding:12px 12px 12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.p-top .back{display:none}
.p-sec{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.p-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.p-title{margin:16px 0 4px;font:600 calc(19px*var(--fz,1))/1.3 var(--sans);letter-spacing:-.01em}
.frow{display:flex;align-items:center;gap:2px;min-height:26px}
.in{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.in[disabled]{background:var(--surface-2);color:var(--muted)}
textarea.in{resize:vertical;line-height:1.5}
.warn{padding:8px 10px;border-radius:var(--r-sm);background:var(--t-dl-bg);color:var(--t-dl-fg);font-size:calc(12.5px*var(--fz,1))}
.err{padding:10px 12px;border-radius:var(--r-sm);background:var(--t-due-bg);color:var(--t-due-fg);font-size:calc(13px*var(--fz,1))}
.savebar{position:sticky;bottom:-24px;z-index:3;display:flex;gap:10px;align-items:center;margin:16px -20px -24px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--line)}
.savebar .state{font-size:calc(12px*var(--fz,1));color:var(--muted);margin-right:auto}
.hist{display:flex;flex-direction:column;gap:2px}
.hitem{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:calc(13px*var(--fz,1))}
.hitem:first-child{border-top:0}
.hby{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--surface-2);font:500 calc(10.5px*var(--fz,1)) var(--mono);color:var(--muted)}
.hnew{color:var(--ink-2);word-break:break-word}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@media (max-width:1023px){
  .panel{position:fixed;inset:0;z-index:60;max-height:none;border:0;border-radius:0;box-shadow:none;flex:none;padding:0 16px 24px}
  .panel.fx-panel{animation:sheetIn .34s var(--ease) both}
  .p-top{margin:0 -16px;padding:max(10px,env(safe-area-inset-top)) 12px 10px 8px}
  .p-top .back{display:inline-flex}.p-top .close{display:none}
  .savebar{margin:16px -16px -24px;padding:12px 16px max(12px,env(safe-area-inset-bottom))}
}

/* people tags + combobox */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 11px 3px 3px;border-radius:999px;border:1px solid transparent;background:var(--accent-soft);color:var(--accent-text);font-weight:500;font-size:calc(13px*var(--fz,1));cursor:pointer;transition:box-shadow .15s,transform .12s var(--ease)}
.ptag:active{transform:scale(.97)}
.ptag .av{width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 calc(10px*var(--fz,1))/24px var(--sans);text-align:center}
.ptag .nt{font-weight:400;opacity:.85}
.ptag.guest{background:var(--surface);color:var(--ink-2);border:1px dashed var(--line-2)}
.ptag.guest .av{background:var(--surface-2);color:var(--ink-2)}
.ptag.unsure{border:1px dashed #B26A00}
.ptag.unsure::after{content:"?";margin-left:4px;font-weight:700;color:#B26A00}
.ptag.on{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft)}
.ptag.fx-tag{animation:tagIn .3s var(--ease) both}
.edbox{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;animation:fxIn .25s var(--ease) both}
.cbx{position:relative}
.cbl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow-2);padding:4px;max-height:280px;overflow-y:auto;animation:popIn .18s var(--ease) both;transform-origin:top center}
.cbo{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer}
.cbo:hover,.cbo:focus-visible{background:var(--accent-soft);outline:none}
.cbo .av{width:26px;height:26px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 calc(10px*var(--fz,1))/26px var(--sans);text-align:center;flex:none}
.cbo .av.g{background:var(--surface-2);color:var(--ink-2)}
.cbo small{display:block;color:var(--muted);font-size:calc(12px*var(--fz,1))}

/* tooltips */
.tip{position:relative;display:inline-flex}
.tipb{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;cursor:help;border-radius:6px}
.tipb span{width:16px;height:16px;border-radius:999px;border:1px solid var(--line-2);font:600 calc(10px*var(--fz,1))/14px var(--mono);text-align:center;color:var(--muted);transition:color .15s,border-color .15s}
.tipb:hover span,.tip.open .tipb span{border-color:var(--accent-text);color:var(--accent-text)}
.tipbox{position:absolute;z-index:30;top:calc(100% + 2px);left:-6px;width:280px;max-width:76vw;padding:10px 12px;border-radius:var(--r-sm);background:#1A1D24;color:#F2F2EE;font:400 calc(12.5px*var(--fz,1))/1.5 var(--sans);letter-spacing:0;text-transform:none;box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(-3px);transition:opacity .15s,transform .2s var(--ease),visibility .15s;pointer-events:none}
.tip.r .tipbox{left:auto;right:-6px}
@media (hover:hover){.tip:hover .tipbox{opacity:1;visibility:visible;transform:none}}
.tip.open .tipbox{opacity:1;visibility:visible;transform:none}

/* popovers */
.pop{position:fixed;top:calc(var(--hdr-h) + 8px);right:max(16px,env(safe-area-inset-right));z-index:70;width:400px;max-height:calc(100vh - var(--hdr-h) - 24px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);animation:popIn .2s var(--ease) both;transform-origin:top right}
.pop-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.nitem{display:flex;gap:10px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;transition:background .15s}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--accent-soft)}
.ndot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:none;margin-top:6px}
.nitem:not(.unread) .ndot{visibility:hidden}
.menu{width:300px;padding:6px}
.mi{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 12px;border:0;border-radius:var(--r-sm);background:none;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.mi:hover{background:var(--surface-2)}
.mi small{color:var(--muted);font-size:calc(12px*var(--fz,1))}
@media (max-width:600px){.pop{left:12px;right:12px;width:auto}}

/* dialogs, toast */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(14,17,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px;overflow-y:auto;animation:fade .2s ease both}
.dialog{width:100%;max-width:620px;margin:auto;background:var(--surface);border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);padding:24px;display:flex;flex-direction:column;gap:14px;animation:dlgIn .22s var(--ease) both}
.dialog h2{margin:0;font:650 calc(22px*var(--fz,1))/1.2 var(--sans);letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:8px;max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 16px;border-radius:var(--r);background:#1A1D24;color:#F2F2EE;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:toastIn .35s var(--ease) both;transform:translateX(-50%)}
.toast .ibtn{background:transparent;border-color:transparent;color:inherit;width:34px;height:34px}
.toast.err{background:#7A1E12}
.tour-art{height:120px;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 20px}
.dots{display:flex;gap:6px}
.dots i{display:block;height:8px;width:8px;border-radius:999px;background:var(--line-2);transition:width .3s var(--ease),background .3s}
.dots i.on{width:22px;background:var(--accent)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;align-items:start;margin-top:18px}

/* 0.1.1 charts: categorical steps validated with the dataviz validator (light on #fff, dark on #151920); see SPEC §5.5 */
:root{--c-dl:#e34948;--c-action:#2a78d6;--c-drafting:#1baf7a;--c-chase:#6250d6;--c-waiting:#b4b2ab;--c-dot:#2a78d6;--c-stale:#ec835a;--grid:#ecebe7;--axis:#cfcdc6}
:root[data-theme="dark"]{--c-dl:#e66767;--c-action:#3987e5;--c-drafting:#199e70;--c-chase:#9085e9;--c-waiting:#4b525d;--c-dot:#3987e5;--c-stale:#ec835a;--grid:#212833;--axis:#343c49}
.dsec{margin-top:36px}
.dsec>.sh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-bottom:14px}
.dsec h2{margin:0;font:600 calc(18px*var(--fz,1))/1.3 var(--sans);letter-spacing:-.01em}
.dsec .q{color:var(--muted);font-size:calc(13.5px*var(--fz,1))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
button.kpi:hover:not([disabled]){transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-2)}
.kpi[disabled]{cursor:default;opacity:.55}
.kpi .v{font:650 calc(32px*var(--fz,1))/1 var(--sans);letter-spacing:-.02em}
.kpi .l{font-weight:600;font-size:calc(13px*var(--fz,1));display:flex;align-items:center;gap:6px}
.kpi .s{font-size:calc(12px*var(--fz,1));color:var(--muted)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:999px;flex:none}
.sdot.s-crit{background:#d03b3b}.sdot.s-warn{background:#fab219}.sdot.s-serious{background:#ec835a}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.alist{margin-top:14px;overflow:hidden}
.arow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.arow-main{flex:1;min-width:0;display:grid;grid-template-columns:150px minmax(0,2.4fr) minmax(0,1.2fr) 190px;gap:14px;align-items:center;padding:12px 8px 12px 16px;border:0;background:none;text-align:left;cursor:pointer;transition:background .15s}
.arow-main:hover{background:var(--surface-2)}
.arow .t{display:block;font-weight:550}.arow .j{display:block;font-size:calc(12px*var(--fz,1))}
.arow .who{font-size:calc(13px*var(--fz,1));color:var(--ink-2)}.arow .am{font-size:calc(12px*var(--fz,1));text-align:right}
.ibtn.sm{width:34px;height:34px;margin-right:10px;flex:none}
.amore{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;font-size:calc(13px*var(--fz,1))}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.stg{position:relative;display:flex;flex-direction:column;gap:3px;padding:16px 14px 16px 22px;border-left:1px solid var(--line);min-width:0}
.stg:first-child{border-left:0;padding-left:18px;border-radius:var(--r) 0 0 var(--r)}
.stg:last-child{border-radius:0 var(--r) var(--r) 0}
.stg::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg)}
.stg:first-child::before{display:none}
.stg.done,.stg.done::before{background:var(--surface-2)}
.stg .n{font:650 calc(28px*var(--fz,1))/1.05 var(--sans);letter-spacing:-.02em}
.stg .sl{font-weight:600;font-size:calc(13px*var(--fz,1))}
.stg .ss{font-size:calc(12px*var(--fz,1));color:var(--muted)}
.stg .st{display:flex;align-items:center;gap:6px;font-size:calc(12px*var(--fz,1));color:var(--ink-2)}
.flowx{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:calc(12.5px*var(--fz,1));color:var(--muted)}
.flowx b{color:var(--ink)}
.chart{margin-top:14px;padding:16px 20px 12px}
.chart h3{margin:0;font:600 calc(14px*var(--fz,1)) var(--sans)}
.chart .cq{margin:0 0 8px;font-size:calc(12.5px*var(--fz,1));color:var(--muted)}
.sp-row{display:grid;grid-template-columns:160px minmax(0,1fr) 64px;gap:14px;align-items:center;border-top:1px solid var(--grid)}
.sp-row:first-child{border-top:0}
.sp-l{font-size:calc(13px*var(--fz,1));display:flex;justify-content:space-between;gap:8px}
.sp-trk{position:relative;min-height:34px}
.sp-g{position:absolute;top:0;bottom:0;border-left:1px solid var(--grid)}
.sp-90{position:absolute;top:0;bottom:0;border-left:1px solid var(--axis)}
.sp-r{font-size:calc(11.5px*var(--fz,1));text-align:right}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;padding:0;border:0;border-radius:999px;background:var(--c-dot);box-shadow:0 0 0 2px var(--surface);cursor:pointer;transition:transform .15s var(--ease);animation:tagIn .4s var(--ease) both}
.dot::before{content:"";position:absolute;inset:-7px;border-radius:999px}
.dot.stale{background:var(--c-stale)}
.dot:hover,.dot:focus-visible{transform:scale(1.35);outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink-2)}
.sp-axis{border-top:1px solid var(--axis)}
.sp-axis .sp-trk{min-height:22px}
.sp-t{position:absolute;top:4px;transform:translateX(-50%);font:500 calc(11px*var(--fz,1)) var(--mono);color:var(--muted);white-space:nowrap}
.sp-t.first{transform:none}
.sp-t.hl{color:var(--ink);font-weight:600}
.out{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:12px;align-items:stretch}
.out .kpis{align-content:stretch}
.hero{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px 24px}
.hero .hv{font:650 calc(56px*var(--fz,1))/1 var(--sans);letter-spacing:-.03em}
.hero .hl{font-weight:600;font-size:calc(15px*var(--fz,1))}
.hero .hs{font-size:calc(13px*var(--fz,1));color:var(--muted)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px;margin-top:12px;align-items:start}
.olist .orow{display:grid;grid-template-columns:78px 92px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:9px 6px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:calc(13px*var(--fz,1));border-radius:0}
.olist .orow:hover{background:var(--surface-2)}
.hb{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 30px;gap:12px;align-items:center;padding:5px 0;font-size:calc(13px*var(--fz,1))}
.hb .trk{height:14px;position:relative}
.hb .fill{display:block;height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--c-action);transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
.hb .v{font:600 calc(12.5px*var(--fz,1)) var(--sans);text-align:right}
.wk{padding:6px 20px 14px}
.wk-row{display:grid;grid-template-columns:150px minmax(0,1fr) 34px 100px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--grid);font-size:calc(13px*var(--fz,1))}
.wk-row:first-child{border-top:0}
.wk-trk{min-width:0}
.wk-bar{display:flex;gap:2px;height:16px;border-radius:0 4px 4px 0;overflow:hidden;transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.wk-bar .seg{display:block;height:100%;min-width:4px}
.wk-t{font-weight:600;text-align:right}
.wk-a{font-size:calc(12px*var(--fz,1));color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:calc(12px*var(--fz,1));color:var(--ink-2);margin-top:10px}
.lg .sw{border-radius:3px}
.swd{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:-1px}
#vtip{position:fixed;left:0;top:0;z-index:95;max-width:300px;padding:8px 10px;border-radius:var(--r-sm);background:#1A1D24;color:#C9CCD2;font:400 calc(12px*var(--fz,1))/1.45 var(--sans);box-shadow:0 10px 28px rgba(0,0,0,.25);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .15s var(--ease)}
#vtip.on{opacity:1;transform:none}
#vtip b{display:block;color:#F2F2EE;font-weight:600;font-size:calc(13px*var(--fz,1))}
@media (max-width:860px){
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stg:nth-child(5){border-left:0}

  .stg:nth-child(5)::before{display:none}

  .wk-row{grid-template-columns:96px minmax(0,1fr) 28px}

}
/* reminders, permissions, requests */
.rem{margin-top:12px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:calc(13px*var(--fz,1));cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
.pact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.setrow.off>div,.setrow.off>.btn,.setrow.off>.switch{opacity:.5}
.setrow.off .btn,.setrow.off .switch{cursor:not-allowed}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:calc(13px*var(--fz,1))}
.ritem .rm{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.perm{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:calc(13px*var(--fz,1))}
.perm .ic{flex:none;margin-top:1px}
.perm .ok{color:var(--ok-fg)}.perm .no{color:var(--muted)}
/* quick update + feedback dialogs, AI desk */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:12px;border:1.5px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:calc(13px*var(--fz,1));text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:96px;height:72px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);animation:tagIn .25s var(--ease) both}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seg3{display:flex;gap:6px}
.desk-item{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.desk-item img{max-width:100%;border-radius:var(--r-sm);border:1px solid var(--line)}
.desk-pre{margin:0;white-space:pre-wrap;word-break:break-word;font:calc(12px*var(--fz,1))/1.5 var(--mono);background:var(--surface-2);padding:12px;border-radius:var(--r-sm);max-height:480px;overflow:auto}

@keyframes fxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tagIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== 0.1.1 visual system =====
   Design read: daily work tool for a small clinical research group; calm "soft structuralism":
   cool silver-grey canvas, one navy accent, Geist + Phosphor Light icons, double-bezel cards,
   floating glass header, pill buttons, restrained spring motion. Dials: variance 4, motion 5, density 6.
   Shape lock: buttons and tags are pills, cards 16px (tray 22px), inputs 10px. */
:root{
  --bg:#F1F2F4;--surface:#FFFFFF;--surface-2:#F5F6F8;--line:rgba(16,24,40,.08);--line-2:rgba(16,24,40,.15);
  --ink:#0F1420;--ink-2:#394150;--muted:#626B7A;
  --accent:#17407F;--accent-fg:#FFFFFF;--accent-text:#17407F;--accent-soft:#E9EFF8;--accent-line:#A9BEDF;
  --shell:rgba(16,24,40,.035);--shell-ring:rgba(16,24,40,.055);--hi:inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-1:0 1px 2px rgba(16,24,40,.04),0 2px 6px -2px rgba(16,24,40,.05);
  --shadow-2:0 2px 4px rgba(16,24,40,.04),0 28px 56px -28px rgba(16,24,40,.28);
  --bezel:0 0 0 1px var(--line),0 0 0 6px var(--shell),0 0 0 7px var(--shell-ring),var(--hi),var(--shadow-1);
  --bezel-2:0 0 0 1px var(--line),0 0 0 6px var(--shell),0 0 0 7px var(--shell-ring),var(--hi),var(--shadow-2);
  --ease:cubic-bezier(.32,.72,0,1);--r:16px;--r-sm:10px;--glass:rgba(255,255,255,.74);
  --code:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;--mono:var(--sans);
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A0C10;--surface:#12151B;--surface-2:#191D25;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --ink:#ECEEF2;--ink-2:#C2C7D0;--muted:#8D95A3;
  --accent:#3F6FCC;--accent-fg:#FFFFFF;--accent-text:#A9C2F2;--accent-soft:#18233A;--accent-line:#34507F;
  --shell:rgba(255,255,255,.025);--shell-ring:rgba(255,255,255,.05);--hi:inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-2:0 2px 4px rgba(0,0,0,.35),0 30px 60px -30px rgba(0,0,0,.8);
  --glass:rgba(18,21,27,.72);
}
body{background:var(--bg);font-feature-settings:"ss01","cv11";letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70rem 36rem at 8% -12%,rgba(23,64,127,.09),transparent 62%),radial-gradient(56rem 30rem at 102% -6%,rgba(27,175,122,.06),transparent 60%)}
:root[data-theme="dark"] body::before{background:radial-gradient(70rem 36rem at 8% -12%,rgba(63,111,204,.16),transparent 62%),radial-gradient(56rem 30rem at 102% -6%,rgba(25,158,112,.08),transparent 60%)}
svg.ic{width:18px;height:18px;flex:none;fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:10px}

/* floating island header */
.hdr{top:10px;width:calc(100% - 24px);max-width:1376px;margin:10px auto 0;border:0;border-radius:22px;background:var(--glass);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);box-shadow:0 0 0 1px var(--line),var(--hi),0 18px 40px -26px rgba(16,24,40,.35)}
.hdr-in{padding:8px 10px 8px 18px}
.brand b{font:700 calc(19px*var(--fz,1))/1 var(--sans);letter-spacing:.06em}
.ver{font:500 calc(11px*var(--fz,1))/1 var(--sans);padding:5px 9px;background:var(--accent-soft);color:var(--accent-text)}
.tabs{gap:2px;padding:4px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tab{padding:7px 12px;border-radius:999px;font-size:calc(13.5px*var(--fz,1));transition:color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.tab:hover{background:transparent;color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(16,24,40,.08)}
.tab[aria-current="page"]::after{display:none}
.search input{height:38px;border-radius:999px;border-color:var(--line);background:var(--surface-2);padding-left:36px;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.search input:focus{background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft);border-color:var(--accent-line);outline:none}
.search svg{left:12px}
.ibtn{width:38px;height:38px;border-radius:999px;border-color:var(--line);background:var(--surface)}
.avatar{width:38px;height:38px;box-shadow:inset 0 0 0 1px var(--accent-line)}

/* pill buttons with a nested icon bubble (button-in-button) */
.btn{min-height:38px;border-radius:999px;padding:0 16px;transition:background .25s var(--ease),box-shadow .25s var(--ease),transform .2s var(--ease),border-color .2s}
.btn svg.ic{transition:transform .35s var(--ease)}
.btn-p,.btn-s{padding-left:6px}
.btn-p svg.ic,.btn-s svg.ic{width:26px;height:26px;padding:5px;border-radius:999px}
.btn-p svg.ic{background:rgba(255,255,255,.16)}
.btn-s svg.ic{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.btn-p:not(:has(svg)),.btn-s:not(:has(svg)){padding-left:16px}
.btn-p{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(16,24,40,.12)}
.btn-p:hover:not([disabled]){box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px -10px rgba(23,64,127,.65)}
.btn-p:hover:not([disabled]) svg.ic,.btn-s:hover:not([disabled]) svg.ic{transform:scale(1.08) rotate(-4deg)}
.btn-s{border-color:var(--line-2);background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn-q{border-radius:999px}
.btn:active:not([disabled]){transform:scale(.98)}

/* type */
.h1{font:650 calc(34px*var(--fz,1))/1.1 var(--sans);letter-spacing:-.035em}
.sub{font-size:calc(15px*var(--fz,1));margin-top:8px}
.lbl{font:500 calc(12.5px*var(--fz,1))/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
.tag{height:24px;padding:0 10px;font:550 calc(12px*var(--fz,1))/1 var(--sans);letter-spacing:0}
.mono{font-family:var(--sans);font-variant-numeric:tabular-nums}
.chip{min-height:34px;border-color:var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.chip .n{font:600 calc(11px*var(--fz,1)) var(--sans);opacity:.7}
.chip[aria-pressed="true"]{box-shadow:0 6px 16px -10px rgba(23,64,127,.7)}

/* double-bezel cards: hairline card sitting in a soft tray */
.box,.card2,.list,.tbox,.kpi,.tile{border:0;border-radius:var(--r);box-shadow:var(--bezel)}
.kpi,.tile{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
button.kpi:hover:not([disabled]),.tile:hover:not([disabled]){transform:translateY(-3px);box-shadow:var(--bezel-2)}
.kpi[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--accent),0 0 0 6px var(--accent-soft),0 0 0 7px var(--accent-line),var(--shadow-2)}
.kpis,.tiles{gap:20px}
.tiles{margin:14px 0 34px}
.ogrid,.agrid,.dgrid{gap:22px}
.out{gap:20px}
.box{padding:20px 22px}
.box h2{font:600 calc(16px*var(--fz,1))/1.3 var(--sans);letter-spacing:-.01em}
.kpi .v,.tile .num{font:650 calc(34px*var(--fz,1))/1 var(--sans);letter-spacing:-.035em}
.hero .hv{font-size:calc(64px*var(--fz,1));letter-spacing:-.045em}
.hero{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 62%)}
.dsec{margin-top:44px}
.dsec h2{font:650 calc(21px*var(--fz,1))/1.25 var(--sans);letter-spacing:-.025em}
.alist,.chart{margin-top:22px}
.row{transition:background .2s var(--ease)}
.list .row:first-child{border-top:0}
.colm{border-radius:var(--r);background:var(--shell);box-shadow:inset 0 0 0 1px var(--line)}
.card{border:0;border-radius:12px;box-shadow:0 0 0 1px var(--line),var(--hi),var(--shadow-1);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),var(--hi),var(--shadow-2)}
.stg::before{border-color:var(--line)}
.stg{border-left-color:var(--line)}

/* details panel, popovers, dialogs, inputs */
.panel{border:0;border-radius:20px;box-shadow:var(--bezel-2)}
.p-top{background:var(--surface)}
.in{border-radius:var(--r-sm);border-color:var(--line-2);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.in:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.edbox{border-radius:14px;border-color:var(--line)}
.pop{border:0;border-radius:20px;box-shadow:var(--bezel-2)}
.overlay{background:rgba(10,14,22,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dialog{border-radius:22px;box-shadow:0 0 0 1px var(--line),0 0 0 7px rgba(255,255,255,.08),0 40px 90px -30px rgba(0,0,0,.5)}
.toast{border-radius:16px}
.ptag{border-radius:999px}
.tipbox{border-radius:12px}
.drop{border-radius:14px}

/* motion: spring-like ease, fade-up with a light blur on entry */
@keyframes fxIn{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.dsec{animation:fxIn .7s var(--ease) both}
.dsec:nth-of-type(2){animation-delay:.06s}.dsec:nth-of-type(3){animation-delay:.12s}.dsec:nth-of-type(4){animation-delay:.18s}
.h1,.sub{animation:fxIn .6s var(--ease) both}
.sub{animation-delay:.05s}
@media (max-width:1023px){.panel{border-radius:0;box-shadow:none}}
@media (max-width:1420px){.tabs{min-width:0;max-width:100%;justify-self:start;overflow-x:auto}}
@media (max-width:600px){.hdr{width:calc(100% - 16px);top:8px;margin-top:8px;border-radius:18px}.hdr-in{padding:8px 8px 10px 14px}.h1{font-size:calc(28px*var(--fz,1))}.kpis,.tiles{gap:16px}.dsec>.sh .q{flex-basis:100%}.kpi{padding:14px 16px}.kpi .v,.tile .num{font-size:calc(28px*var(--fz,1))}}
@media (prefers-reduced-motion:reduce){.dsec,.h1,.sub{animation:none!important}}
@supports not (backdrop-filter:blur(1px)){.hdr{background:var(--surface)}}

.desk-pre,#desk-batch{font-family:var(--code)}
.row .meta,.sp-t,.bval,.hby,.hitem .mono{font-variant-numeric:tabular-nums}
.brand span{font:600 calc(15px*var(--fz,1))/1 var(--sans);color:var(--ink-2);letter-spacing:-.01em}

/* 0.1.2: delete, own-history actions, appearance */
.btn-del{color:#B42318;background:#FEF0EE;border-color:rgba(180,35,24,.22)}
.btn-del:hover:not([disabled]){background:#FDE2DE}
.btn-del svg.ic{background:rgba(180,35,24,.1)!important;box-shadow:none!important}
.btn-red{background:#C8321F;color:#fff;padding-left:16px}
.btn-red:hover:not([disabled]){background:#B02A19;box-shadow:0 10px 22px -10px rgba(200,50,31,.6)}
:root[data-theme="dark"] .btn-del{color:#FFB4A9;background:#3A1A16;border-color:rgba(255,120,100,.25)}
:root[data-theme="dark"] .btn-red{background:#D9473C}
.dzone{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line-2);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.dzone .muted{font-size:calc(12px*var(--fz,1));flex:1 1 200px}
.delnote{margin-top:12px;padding:12px 14px;border-radius:12px;background:#FEF0EE;color:#7A271A;font-size:calc(13px*var(--fz,1));display:flex;flex-direction:column;gap:8px}
:root[data-theme="dark"] .delnote{background:#3A1A16;color:#FFCBC2}
.hitem .acts{display:flex;align-items:flex-start;gap:0}
.hitem .acts .btn{min-height:30px;padding:0 6px}
.nedit{display:flex;gap:6px;margin-top:6px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .2s var(--ease),color .2s var(--ease)}
.seg button svg.ic{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(16,24,40,.08)}
html{transition:background-color .3s var(--ease)}
/* header fit: keep tabs and tools apart */
.hdr-in{column-gap:14px}.tools{gap:6px}.icons{gap:6px}.search{flex:1 1 160px}
@media (max-width:560px){.search{min-width:0;flex:1 1 0}.tools .btn{padding-right:6px}.ver{display:none}.icons{gap:4px}.icons .ibtn,.icons .avatar{width:34px;height:34px}.brand b{font-size:calc(17px*var(--fz,1))}}

/* 0.1.3 dashboard customization */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.dtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:4px}
.dcount{font-size:calc(13px*var(--fz,1))}
.ogrid.one{grid-template-columns:1fr}
.dempty{margin-top:28px;padding:34px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.dempty p{margin:0}
.dpop{width:380px}
.dp-body{display:flex;flex-direction:column;gap:10px;padding:14px}

.segc{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.segc button{flex:1;min-height:32px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:500 calc(13px*var(--fz,1))/1 var(--sans);cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.segc button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(16,24,40,.08)}
.dp-sec{border-radius:12px;padding:8px 8px 8px 12px;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);transition:opacity .2s var(--ease)}
.dp-sec.off{opacity:.62;background:var(--surface-2)}
.dp-sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dp-mv{display:flex;gap:2px}
.dp-mv .ibtn{width:30px;height:30px;margin:0}
.dp-mv .ibtn[disabled]{opacity:.35;cursor:default}
.dp-mv .ibtn svg.ic{width:15px;height:15px}
.dp-chk{display:flex;align-items:center;gap:10px;min-height:30px;cursor:pointer;font-size:calc(13.5px*var(--fz,1))}
.dp-chk input{width:16px;height:16px;margin:0;accent-color:var(--accent);flex:none}
.dp-main b{font-weight:600}

@media (max-width:600px){.dtools{width:100%}.dtools .btn{margin-left:auto}}

/* 0.1.3 calmer motion: entry animations play once, when something new appears; no blur flashes */
@keyframes fxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dsec{animation-duration:.5s}
.h1,.sub{animation-duration:.45s}
.calm .dsec,.calm .h1,.calm .sub,.calm .fx-in,.calm .bfill,.calm .hb .fill,.calm .wk-bar,.calm .dot,.calm .badge,.calm .tab[aria-current="page"]::after,.calm .edbox{animation:none}
.calm-pop .pop{animation:none}
.calm-dlg .overlay:not(.tour-ov),.calm-dlg .dialog:not(.tour-dlg){animation:none}
.calm-tour .tour-ov,.calm-tour .tour-dlg{animation:none}
.calm-pal .pal-ov,.calm-pal .pal{animation:none}
.tbody{display:flex;flex-direction:column;gap:14px;transition:opacity .22s ease,transform .22s var(--ease)}
.tbody.tout{opacity:0;transform:translateY(4px);transition-duration:.13s}
.tour-b{margin:0;line-height:1.6;color:var(--ink-2)}
/* 0.2.0 welcome page and anchored tour */
.wel-ov{align-items:center}
.wel{max-width:520px;gap:14px;padding:26px 28px 22px}
.wel-logo{align-self:center;width:min(300px,78%);background:#fff;border-radius:12px;overflow:hidden}
.wel-logo img{display:block;width:100%;height:auto}
.wel h2{margin:4px 0 0;text-align:center;font:500 calc(28px*var(--fz,1))/1.2 var(--serif);color:var(--ink)}
.wel-lead{margin:0;text-align:center;color:var(--ink-2);line-height:1.6}
.wel-points{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.wel-points li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:calc(14px*var(--fz,1));line-height:1.5;color:var(--ink-2)}
.wel-points b{color:var(--ink)}
.wel-ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text)}
.wel-ic .ic{width:18px;height:18px}
.wel-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.wel-btns .btn-p{min-height:44px;padding:0 22px}
.coach{position:fixed;inset:0;z-index:90}
.coach-block{position:absolute;inset:0}
.coach-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 2px var(--accent),0 0 0 9999px rgba(12,16,24,.56);pointer-events:none;transition:left .35s var(--ease),top .35s var(--ease),width .35s var(--ease),height .35s var(--ease)}
.coach-card{position:fixed;display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2),0 18px 40px -18px rgba(0,0,0,.45);border:1px solid var(--line);animation:coachIn .28s var(--ease)}
.calm-tour .coach-card{animation:none}
@keyframes coachIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.coach-card h2{margin:2px 0 0;font:600 calc(17px*var(--fz,1))/1.3 var(--sans)}
.coach-card p{margin:0;font-size:calc(14px*var(--fz,1));line-height:1.6;color:var(--ink-2)}
.coach-top{display:flex;align-items:center;justify-content:space-between;font-size:calc(12px*var(--fz,1))}
.coach-top .btn-q{min-height:28px;padding:0 4px;font-size:calc(12.5px*var(--fz,1))}
.coach-nav{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.coach-nav.many .dots{flex:1 0 100%;gap:5px;margin-bottom:4px}
.coach-nav .dots i{width:6px;height:6px}
.coach-nav .dots i.on{width:16px}
.coach-nav .dots i.pg{margin-left:7px}
.coach-eb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;font:600 calc(11px*var(--fz,1))/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.coach-key{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--accent-soft);letter-spacing:.04em}
.coach-key::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor}
.coach-card .coach-k{font-weight:600;color:var(--ink);line-height:1.45}
.coach-arrow{position:absolute;width:16px;height:16px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg);display:none}
.coach-card[data-side="below"] .coach-arrow{display:block;top:-9px;border-right:0;border-bottom:0}
.coach-card[data-side="above"] .coach-arrow{display:block;bottom:-9px;border-left:0;border-top:0}
.coach-card[data-side="right"] .coach-arrow{display:block;left:-9px;border-top:0;border-right:0}
.coach-card[data-side="left"] .coach-arrow{display:block;right:-9px;border-bottom:0;border-left:0}
@media (prefers-reduced-motion:reduce){.coach-spot{transition:none}.coach-card{animation:none}}
@media (max-width:560px){.coach-nav .dots{display:none}.wel{padding:20px 18px 16px}.wel h2{font-size:calc(24px*var(--fz,1))}}
.tbody h2{margin:0}
@media (hover:none){.tip:not(.open) .tipbox{display:none}}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
.tbody{min-height:286px}
@media (max-width:600px){.tbody{min-height:353px}}

/* 0.1.3 everything visible: closed column, status filter, original Excel row */
.closedcol{background:var(--surface-2)}
.closedcol .card{opacity:.92}
tr.closed td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.xl-t{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;color:var(--accent-text);font:500 calc(14px*var(--fz,1))/1.3 var(--sans);cursor:pointer}
.xl-t svg.ic{width:16px;height:16px}
.p-sec:has(> .xl-t){flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px}
.p-sec:has(> .xl-t) > :not(.xl-t):not(.tip){flex-basis:100%}
.xl{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 12px;margin:10px 0 0;font-size:calc(13px*var(--fz,1))}
.xl dt{color:var(--muted)}
.xl dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
@media (max-width:600px){.xl{grid-template-columns:1fr}.xl dt{margin-top:6px}}

/* 0.1.3 VIBRA logo */
.brand{align-items:center}
.brand .logo{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 0 0 1px var(--line)}
.pop.menu .mi{flex-direction:row;gap:10px;align-items:flex-start}
.pop.menu .mi>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.pop.menu .mi svg.ic{margin-top:1px;color:var(--accent-text)}
@media (max-width:560px){.brand .logo{width:26px;height:26px}}

/* 0.1.4 corresponding and first author, visible beside "ball is with" */
.roles{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:calc(11.5px*var(--fz,1));color:var(--muted)}
.roles i,.p-roles i{font-style:normal;font-weight:600;letter-spacing:.02em;text-transform:uppercase;font-size:calc(9.5px*var(--fz,1));margin-right:4px;color:var(--accent-text);opacity:.8}
.p-roles{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:calc(13px*var(--fz,1));color:var(--ink-2)}
.p-roles .none{color:var(--muted)}

/* 0.1.6 Quick update: one floating button on every screen, lifted above the save bar when a manuscript is open */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:65;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 calc(14.5px*var(--fz,1)) var(--sans);letter-spacing:.005em;box-shadow:0 12px 28px -8px rgba(23,64,127,.6),0 2px 6px rgba(0,0,0,.14);cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s,bottom .28s var(--ease),right .28s var(--ease)}
.fab svg.ic{width:22px;height:22px}
.fab:hover{transform:translateY(-2px);box-shadow:0 16px 32px -8px rgba(23,64,127,.65),0 3px 8px rgba(0,0,0,.16)}
.fab:active{transform:scale(.97)}
.fab:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px}
.fab.up{bottom:calc(max(20px,env(safe-area-inset-bottom)) + 72px)}
@media (min-width:1024px){.fab.up{bottom:max(20px,env(safe-area-inset-bottom))}.fab.side{right:calc(max(0px,(100vw - 1400px) / 2) + 16px + 440px + 24px)}}
@media (max-width:600px){.fab{height:54px}}
@media (max-width:359px){.fab span{display:none}.fab{width:54px;padding:0;justify-content:center}}
@media (max-width:900px){.toast{bottom:calc(max(24px,env(safe-area-inset-bottom)) + 70px)}}
@media print{.fab{display:none}}
.qu-lead{margin:0;color:var(--ink-2);line-height:1.55}
.qu-ex{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);font-size:calc(13px*var(--fz,1))}
.qu-ex q{font-style:italic;color:var(--ink)}
.qu-ex .tags{gap:5px}
.qu-ex .tag{font-size:calc(11.5px*var(--fz,1))}
/* 0.2.6: text size (Settings, Appearance). The web build multiplies every font size by --fz (tools/build_web.py) */
/* 0.2.7 (admin: Small and Medium hardly differed, Large was much bigger; "thành khung kéo 6 nấc"): six even steps of 6%,
   step 3 is the usual size; the admin's default for some members is step 5 (a little smaller than the old Large) */
html[data-fs="1"]{--fz:.88}
html[data-fs="2"]{--fz:.94}
html[data-fs="4"]{--fz:1.06}
html[data-fs="5"]{--fz:1.12}
html[data-fs="6"]{--fz:1.18}
.fs-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fs-row .fs-a{font-weight:700;line-height:1;text-align:center;color:var(--ink-2);flex:none}
.fs-sl{display:flex;align-items:center;gap:10px;flex:1 1 220px;max-width:360px}
.fs-sl .fs-v{min-width:44px;text-align:right;font-size:calc(12.5px*var(--fz,1));color:var(--muted)}
.fs-rng{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;height:28px;margin:0;background:transparent;cursor:pointer}
.fs-rng::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:radial-gradient(circle,var(--muted) 1.6px,transparent 2.2px) 0 50%/calc((100% - 22px) / 5) 6px repeat-x content-box,var(--surface-2);background-origin:content-box;padding:0 8px;box-shadow:inset 0 0 0 1px var(--line)}
.fs-rng::-moz-range-track{height:6px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.fs-rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:999px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.fs-rng::-moz-range-thumb{width:18px;height:18px;border-radius:999px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.fs-rng:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-radius:999px}
.fs-ticks{display:flex;justify-content:space-between;padding:0 11px;margin-top:-4px;font-size:calc(10.5px*var(--fz,1));color:var(--muted)}
.qu-hint{margin:2px 0 0;font-size:calc(12px*var(--fz,1));color:var(--muted)}
/* 0.2.6: Paste inside the text box; the box keeps room for it */
.ta-wrap{position:relative}
.ta-wrap textarea{width:100%;padding-bottom:40px}
.paste-btn{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 calc(12.5px*var(--fz,1)) var(--sans);cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.paste-btn:hover{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.paste-btn .ic{width:15px;height:15px}
/* 0.2.6: typing in a dialog on a phone: the dialog sits in the space above the keyboard */
@media (max-width:899px){
  .kb-open .overlay{top:var(--vvt,0);bottom:auto;height:var(--vvh,100%);padding:8px 10px 10px;align-items:flex-start}
  .kb-open .overlay .dialog{margin:0 auto;animation:none;padding:16px 16px 18px;gap:12px}
  .kb-open .qu-lead,.kb-open .qu-ex,.kb-open .fb-lead,.kb-open .qu-fb{display:none}
}
.au-exp{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-top:4px}
.appsteps{margin:0;padding-left:18px;font-size:calc(13px*var(--fz,1));color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.pairbox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft)}
.feedbox{display:flex;flex-direction:column;gap:8px;margin:0 0 10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft)}
.feedbox .btns{margin-top:0}
.feedbox .frow{display:flex;align-items:center}
.paircode{font-size:calc(26px*var(--fz,1));letter-spacing:.12em;color:var(--accent-text)}
/* hidden tip boxes near the right edge must never make the page scroll sideways */
#app{overflow-x:clip}

/* ===== 0.1.8 calm workspace: sidebar instead of the header, warm paper palette, serif titles =====
   Layout: .shell = sidebar (.sb, 264px, collapsible to a 60px rail, a drawer below 900px) + main column.
   Everything the header held moved: views and New manuscript to the sidebar, bell and Settings to its foot,
   search to the floating Search button (Ctrl/Cmd+K), export to the page tools at the top right of each view. */
:root{
  --bg:#F8F6F1;--side:#F1EEE6;--surface:#FFFFFF;--surface-2:#F4F1EA;--hover:rgba(31,30,27,.05);--sel:rgba(31,30,27,.08);
  --line:rgba(31,30,27,.10);--line-2:rgba(31,30,27,.18);
  --ink:#1F1E1B;--ink-2:#3D3B36;--muted:#75726A;
  --accent:#17407F;--accent-fg:#FFFFFF;--accent-text:#1F4A8A;--accent-soft:#E9EDF4;--accent-line:#B7C5DD;
  --shell:transparent;--shell-ring:transparent;--hi:inset 0 0 0 0 transparent;
  --shadow-1:0 1px 2px rgba(31,30,27,.04);
  --shadow-2:0 1px 2px rgba(31,30,27,.05),0 18px 44px -24px rgba(31,30,27,.28);
  --bezel:0 0 0 1px var(--line),var(--shadow-1);--bezel-2:0 0 0 1px var(--line),var(--shadow-2);
  --r:14px;--r-sm:10px;--hdr-h:0px;--sbw:264px;
  --serif:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif;
  --t-wait-bg:#EFECE5;--t-wait-fg:#56524A;
}
:root[data-theme="dark"]{
  /* 0.2.3 (admin): a darker page, the sidebar darker still. 0.2.4: cards and popups a step darker, text, buttons and
     tags with more contrast and colour (same hues); light mode unchanged */
  --bg:#131312;--side:#0B0B0A;--surface:#242422;--surface-2:#2E2E2B;--hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.20);
  --ink:#F8F6F0;--ink-2:#E2DFD6;--muted:#B3B0A6;
  --accent:#3B70D4;--accent-fg:#FFFFFF;--accent-text:#BCD2F8;--accent-soft:#263655;--accent-line:#5577B0;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-2:0 1px 2px rgba(0,0,0,.4),0 24px 54px -26px rgba(0,0,0,.85);
  --danger:#FFB0A2;--ok-bg:#1E3D28;--ok-fg:#B5E8C2;
  --t-due-bg:#4D201A;--t-due-fg:#FFC0B4;--t-dl-bg:#463716;--t-dl-fg:#F7D78E;--t-act-bg:#203761;--t-act-fg:#C4D8FA;
  --t-chase-bg:#382A5A;--t-chase-fg:#DDCCFF;--t-wait-bg:#3B3A36;--t-wait-fg:#E2DED3;--t-draft-bg:#1E3D28;--t-draft-fg:#B5E8C2;
}
:root[data-theme="dark"] .btn-s{background:var(--surface-2);border-color:rgba(255,255,255,.22);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
:root[data-theme="dark"] .btn-s:hover:not([disabled]){background:#383834}
:root[data-theme="dark"] .btn-s svg.ic{background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .btn-p:hover:not([disabled]){box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 22px -10px rgba(59,112,212,.7)}
:root[data-theme="dark"] .btn-q:hover{background:var(--accent-soft)}
body::before,:root[data-theme="dark"] body::before{display:none}
body{background:var(--bg)}
svg.ic2{fill:none!important;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.shell{display:flex;min-height:100vh;min-height:100dvh}
.mainwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1320px;width:100%;padding:30px 40px 132px}
.cols{gap:28px}
.panel{top:16px;max-height:calc(100vh - 32px)}

/* sidebar */
.sb{position:sticky;top:0;height:100vh;height:100dvh;flex:0 0 var(--sbw);width:var(--sbw);display:flex;flex-direction:column;gap:2px;padding:10px 10px 12px;background:var(--side);border-right:1px solid var(--line);overflow:hidden;z-index:30;transition:width .25s var(--ease),flex-basis .25s var(--ease)}
.sb-top{display:flex;align-items:center;gap:6px;height:44px;padding:0 2px 0 6px;margin-bottom:6px}
.sb-brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1;overflow:hidden;height:44px;padding-top:12px!important;padding:0 4px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink)}
.sb-brand img{width:28px;height:28px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.sb-brand b{font:800 calc(25px*var(--fz,1))/1 var(--sans);letter-spacing:.08em;color:var(--accent-text)} /* 0.2.9 (admin): the brand name larger */
:root:not([data-theme="dark"]) .sb-brand b{color:#14396E}
.sb-brand span{font:500 calc(15px*var(--fz,1))/1 var(--sans);color:var(--ink-2)}
.sb-brand em{font:500 calc(10.5px*var(--fz,1))/1 var(--sans);font-style:normal;color:var(--muted);padding:3px 6px;border-radius:999px;background:var(--hover)}
.sb-ib{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;flex:none}
.sb-ib:hover{background:var(--hover);color:var(--ink)}
.sb-item{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--ink-2);font:500 calc(14px*var(--fz,1))/1.2 var(--sans);text-align:left;cursor:pointer;text-decoration:none}
.sb-item:hover{background:var(--hover);color:var(--ink)}
.sb-item[aria-current="page"]{background:var(--sel);color:var(--ink)}
.sb-item svg.ic{width:19px;height:19px;color:var(--muted)}
.sb-item[aria-current="page"] svg.ic{color:var(--ink)}
.sb-item .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .cnt{font:500 calc(11.5px*var(--fz,1)) var(--sans);color:var(--muted)}
.sb-item .badge{position:static;margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 calc(11px*var(--fz,1))/20px var(--sans);text-align:center}
.sb-new{margin-bottom:6px;color:var(--ink);font-weight:550}
.sb-new .plus{width:24px;height:24px;margin-left:-2px;border-radius:999px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sb-new .plus svg.ic{width:14px;height:14px;color:var(--accent-fg)}
/* 0.2.7: New manuscript in the phone top bar, a pill with a soft gradient ring (admin: "cách điệu hơn xíu") */
.tb-new{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 4px;margin-right:4px;border:1.5px solid transparent;border-radius:999px;cursor:pointer;flex:none;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--accent),#7C6CF0 55%,#1BAF7A) border-box;
  color:var(--ink);font:650 calc(13.5px*var(--fz,1)) var(--sans);letter-spacing:.01em;box-shadow:0 4px 14px -8px rgba(42,120,214,.7);transition:transform .15s var(--ease)}
.tb-new:active{transform:scale(.96)}
.tb-new .plus{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;
  background:linear-gradient(135deg,var(--accent),#7C6CF0)}
.tb-new .plus svg.ic{width:14px;height:14px;color:#fff;stroke-width:2.4}
.tb-new:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* the same look for New manuscript in the sidebar on a computer (admin: "thay trên bản web luôn") */
.sb .sb-new{min-height:40px;margin-bottom:8px;border:1.5px solid transparent;border-radius:999px;font-weight:650;color:var(--ink);
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--accent),#7C6CF0 55%,#1BAF7A) border-box;box-shadow:0 4px 14px -9px rgba(42,120,214,.7);padding:0 12px 0 6px}
.sb .sb-new:hover{background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,linear-gradient(120deg,var(--accent),#7C6CF0 55%,#1BAF7A) border-box}
.sb .sb-new .plus{width:26px;height:26px;margin-left:0;background:linear-gradient(135deg,var(--accent),#7C6CF0);color:#fff}
.sb .sb-new .plus svg.ic{color:#fff;stroke-width:2.4}

    box-shadow:0 0 0 1px var(--line),0 28px 70px -14px rgba(15,20,32,.38),0 10px 24px -10px rgba(15,20,32,.2)}
  /* 0.2.3 (admin): all four corners round, also where the system always shows scroll bars (a mouse on a Mac, Windows):
     a thin bar kept clear of the corners */

  .shell.pshown .panel::-webkit-scrollbar-track{background:transparent;margin:14px 0}
  .shell.pshown .panel::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--muted) 38%,transparent);border-radius:999px;border:4px solid transparent;background-clip:padding-box}

  /* 0.2.3 (admin): Today as blocks makes room for the card (the blocks move left and wrap) instead of going under it */

  .shell.pshown .pscrim{display:block;position:fixed;inset:0;z-index:40;pointer-events:none;background:rgba(15,20,32,.13);animation:fadeIn .25s var(--ease) both}
  .shell.pshown .main [aria-current="true"],.shell.pshown .sb [aria-current="true"]{position:relative;z-index:45}
  .shell.pshown .main .row[aria-current="true"],.shell.pshown .main .block[aria-current="true"],.shell.pshown .main .card[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent),0 8px 24px -10px rgba(15,20,32,.35);border-radius:12px}
  .shell.pshown ~ .fabs{right:calc(var(--pw) + 30px)}

/* floating Search + Quick update */

  .fabs .fab{min-width:54px;gap:0;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:padding .3s var(--ease),transform .18s var(--ease)}

/* ===== 0.2.8 motion. The card is moved by script (springs; see cardIn, cardOut); the CSS entry animations step aside.
   The layer under the card: a dim over the whole page on phones, the light dim on computers. */
.panel.fx-panel,.shell.pshown .panel.fx-panel{animation:none}
@media (max-width:1023px){.shell.pshown .pscrim{display:block;position:fixed;inset:0;z-index:55;pointer-events:none;background:rgba(12,14,20,.34)}}
html,body{overscroll-behavior-x:none} /* the browser's own two-finger back swipe never fights the card's swipe */
.shell.pshown .panel{touch-action:pan-y}
/* Search and Quick update stacked at the bottom right, above every layer (admin, 24 Oct 2026: "icon tìm kiếm và quick
   update giờ xếp dọc ... tìm kiếm và quick update là lớp trên cùng"): Quick update at the bottom, Search above it, a
   little smaller. From 840 px wide the page keeps a free column along the right edge (--fcol), so the buttons never
   cover a line of the list or the card; narrower, they float over the content (admin: "trên laptop mà kéo hẹp cửa sổ
   lại thì vẫn lẹm vào thôi, đó là điều bình thường"). */
:root{--fcol:0px}
.fabs{flex-direction:column;align-items:flex-end;gap:12px;z-index:66;right:max(16px,env(safe-area-inset-right));bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px))} /* admin: "lên trên xíu" */
.fabs .fab-s{width:46px;height:46px;margin-right:4px}
.fabs .fab-s svg.ic{width:19px;height:19px}
.fabs.up{bottom:calc(max(30px,calc(env(safe-area-inset-bottom) + 12px)) + 64px)} /* over an open manuscript on a phone: above Save */
/* admin, 24 Oct 2026 ("Discard và save của pop up ra gần giữa để không chạm vào nút save"): on a phone the card's
   Discard and Save sit in the middle, under their state line, away from the floating buttons at the right edge */
@media (max-width:839px){
  .panel .savebar{flex-wrap:wrap;justify-content:center;row-gap:4px;padding-top:8px}
  .panel .savebar .state{flex-basis:100%;margin:0;text-align:center;font-size:calc(11.5px*var(--fz,1))}
  .panel .savebar .btn{min-width:112px;justify-content:center}
}
.fabs .fab{min-width:54px;height:54px;gap:0;overflow:hidden;white-space:nowrap;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:padding .42s var(--spr,cubic-bezier(.2,.9,.25,1)),transform .18s var(--ease),box-shadow .2s}
.fabs .fab span{display:inline-block;max-width:140px;opacity:1;margin-left:8px;transition:max-width .42s var(--spr,cubic-bezier(.2,.9,.25,1)),opacity .2s,margin-left .42s var(--spr,cubic-bezier(.2,.9,.25,1))}
.fabs .fab.round:not(.peek){padding:0 16px}
.fabs .fab.round:not(.peek) span{max-width:0;opacity:0;margin-left:0;transition:max-width .36s var(--spr,cubic-bezier(.2,.9,.25,1)),opacity .12s,margin-left .36s var(--spr,cubic-bezier(.2,.9,.25,1))}
@media (min-width:840px){
  :root{--fcol:84px}
  .fabs,.fabs.up{right:max(16px,env(safe-area-inset-right));bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px))}
  .wrap{padding-right:max(16px,calc(var(--fcol) - max(0px,(100vw - var(--sbw) - 1400px) / 2)))}
  .shell.pshown .panel{right:var(--fcol)!important}
  .shell.pshown.tvb .wrap{padding-right:calc(var(--pw) + var(--fcol) + 16px)}
  .shell.pshown ~ .fabs{right:max(16px,env(safe-area-inset-right))}
  .fabs .fab.round:not(.peek):hover span,.fabs .fab.round:not(.peek):focus-visible span{max-width:140px;opacity:1;margin-left:8px}
  .fabs .fab.round:not(.peek):hover,.fabs .fab.round:not(.peek):focus-visible{padding:0 20px 0 16px}
}
@media (min-width:1024px){.shell{--pw:min(640px,calc(100vw - var(--sbw) - var(--fcol) - 400px))}.shell.tvb{--pw:clamp(400px,calc(100vw - var(--sbw) - var(--fcol) - 560px),560px)}}
/* List and Blocks change shape in place; segmented controls slide their highlight */
.ss-ghost{position:fixed;z-index:30;pointer-events:none;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 6px 18px -10px rgba(15,20,32,.25)}
.seg{position:relative}.seg button{position:relative;z-index:1}

/* What's new in Settings: a frame that scrolls inside, one line per older release */
.wn-frame{max-height:50vh;max-height:50dvh;overflow-y:auto;overscroll-behavior:contain;margin-top:6px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.wn-item{border-top:1px solid var(--line)}.wn-item:first-child{border-top:0}
.wn-line{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.wn-line:hover{background:var(--hover)}
.wn-line b{flex:1;min-width:0;font-weight:600}
.wn-line .mono{font-size:calc(12px*var(--fz,1));white-space:nowrap}
.wn-line svg.ic{width:15px;height:15px;flex:none;color:var(--muted);transform:rotate(-90deg);transition:transform .25s var(--ease)}

/* 0.2.8 urgency scrubber (admin, iPhone screenshot: "cái bao ngoài của thanh cuộn cũng cùng hình dạng như các gạch bên
   trong, chứ không phình to như hình, rất xấu"): no capsule. A hairline track as thin as the notches, the part on
   screen darker on it (like the system's indicator, which is hidden on Today), the notches as thin lines in their
   colours; touched, only the notches near the finger lengthen a little and nothing else widens. It ends above the
   floating buttons. */
#scrub{bottom:calc(max(30px,calc(env(safe-area-inset-bottom) + 12px)) + 128px);width:40px}
.sc-rail{width:28px}
.sc-rail::before,#scrub.drag .sc-rail::before{right:6px;top:-4px;bottom:-4px;width:2.5px;border-radius:2px;background:color-mix(in srgb,var(--ink) 13%,transparent);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.sc-n{right:3px;width:9px;height:2.5px;margin-top:-1.25px;border-radius:2px;transition:width .14s var(--ease)}
.sc-thumb{right:6px;width:2.5px;border:0;border-radius:2px;background:color-mix(in srgb,var(--ink) 52%,transparent);opacity:1}
#scrub.drag .sc-thumb{opacity:.35}
.sc-bub{right:44px}
:root.sc-sys{scrollbar-width:none}
html.sc-sys::-webkit-scrollbar,html.sc-sys body::-webkit-scrollbar{display:none;width:0;height:0}
/* 0.2.8 (admin, Windows: "thanh scrolling mặc định trên windows sao thấy thô thiển vậy ... làm cho nó thanh mảnh lại"):
   one slim scroll bar everywhere on Windows and Linux (html.sb-thin): thin, round, a soft thumb that darkens on hover,
   no arrows, a clear track, both themes; Macs and phones keep their own */
html.sb-thin,html.sb-thin *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 42%,transparent) transparent}
html.sb-thin *:hover{scrollbar-color:color-mix(in srgb,var(--muted) 70%,transparent) transparent}
@supports not (scrollbar-width:thin){
  html.sb-thin ::-webkit-scrollbar{width:10px;height:10px;background:transparent}
  html.sb-thin ::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--muted) 42%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
  html.sb-thin ::-webkit-scrollbar-thumb:hover,html.sb-thin ::-webkit-scrollbar-thumb:active{background-color:color-mix(in srgb,var(--muted) 72%,transparent)}
  html.sb-thin ::-webkit-scrollbar-track,html.sb-thin ::-webkit-scrollbar-corner{background:transparent}
  html.sb-thin ::-webkit-scrollbar-button{display:none;width:0;height:0}
}

/* ===== 0.2.9 navigation in three layers (html.nav3; data-lay: stack, short, rail, side). The page is a layer of its own
   (opaque, above the sidebar), so it can slide over the sidebar or off it. */
html.nav3 .mainwrap{position:relative;z-index:31;background:var(--bg)}
html.nav3[data-lay="stack"] .sb,html.nav3[data-lay="short"] .sb{z-index:1;width:min(320px,calc(100vw - 64px));box-shadow:none;transition:none;transform:translateX(calc(min(320px,100vw - 64px) * -.25));opacity:.55}
html.nav3[data-lay="stack"] .shell.drawer .sb{transform:none;opacity:1}
html.nav3[data-lay="stack"] .shell.drawer .mainwrap{transform:translateX(min(320px,calc(100vw - 64px)));box-shadow:-16px 0 36px -12px rgba(0,0,0,.35)}
html.nav3[data-lay="stack"] .shell.drawer .scrim,html.nav3[data-lay="short"] .shell.drawer .scrim{display:block;position:fixed;top:0;bottom:0;right:0;left:auto;width:64px;background:transparent;z-index:40}
html.nav3[data-lay="stack"] .sb-top .sb-ib.sb-hide,html.nav3[data-lay="short"] .sb-top .sb-ib.sb-hide{display:none}
/* a phone on its side: the sidebar's icons stay in view as a rail; a slimmer top bar */
html.nav3[data-lay="short"]{--hdr-h:44px}
html.nav3[data-lay="short"] .sb{transform:none;opacity:1}
html.nav3[data-lay="short"] .mainwrap{margin-left:60px}
html.nav3[data-lay="short"] .shell.drawer .mainwrap{transform:translateX(calc(min(320px,100vw - 64px) - 60px));box-shadow:-16px 0 36px -12px rgba(0,0,0,.35)}
html.nav3[data-lay="short"] .shell.drawer .scrim{width:auto;left:min(320px,calc(100vw - 64px))}
html.nav3[data-lay="short"] .topbar{height:44px}
/* wider: the full sidebar over the rail (peek), or under the page while it slides (slide) */
html.nav3 .sb{transition:none}
html.nav3 .shell.sbpeek .sb,html.nav3 .shell.sbslide .sb{position:fixed;left:0;top:0;bottom:0;width:264px;flex:none}
html.nav3 .shell.sbpeek .sb{z-index:30;box-shadow:none}
/* 0.2.9 (admin: "hiệu ứng khi ấn nút ẩn hiện sidebar như là kéo tờ giấy ra vô á"): beside the sidebar the page is a sheet
   lying on it (a soft shadow at its left edge instead of a line); the sidebar's button slides the sheet in or out */
:root{--d-edge:-1px 0 0 rgba(31,30,27,.07),-14px 0 30px -18px rgba(31,30,27,.38);--d-edge-up:-1px 0 0 rgba(31,30,27,.08),-26px 0 50px -16px rgba(31,30,27,.42)}
:root[data-theme="dark"]{--d-edge:-1px 0 0 rgba(255,255,255,.07),-16px 0 34px -16px rgba(0,0,0,.85);--d-edge-up:-1px 0 0 rgba(255,255,255,.09),-28px 0 56px -14px rgba(0,0,0,.95)}
html.nav3:not([data-lay="stack"]) .mainwrap{box-shadow:var(--d-edge)}
html.nav3:not([data-lay="stack"]) .sb{border-right-color:transparent}
html.nav3 .shell.sbpeek .mainwrap,html.nav3 .shell.sbpeek .panel{transform:translateX(204px)}
html.nav3 .shell.sbslide .sb{z-index:30}
html.nav3 .shell.sbshow .sb{z-index:1}html.nav3 .shell.sbshow .mainwrap{z-index:31} /* 0.3.0: the page slides off the sidebar, over it */
html.nav3 .shell.sbpeek .mainwrap,html.nav3 .shell.sbslide .mainwrap{margin-left:60px}
html.nav3[data-lay="short"] .shell.sbc .sb{width:60px;padding:10px 8px 12px}
/* the floating buttons stay in their corner (0.2.7 moved them beside the card) */
html.nav3 .shell.pshown ~ .fabs{right:max(16px,env(safe-area-inset-right))}
/* medium widths: the card covers the page beside the rail */
html.nav3[data-lay="rail"] .shell.pshown .panel{left:60px!important}
/* from 840 px without the free column (under 1200 px), the card is a little narrower than with it */
html.nav3[data-lay="side"] .shell{--pw:clamp(340px,calc(100vw - var(--sbw) - var(--fcol) - 360px),640px)}
html.nav3[data-lay="side"] .shell.tvb{--pw:clamp(340px,calc(100vw - var(--sbw) - var(--fcol) - 520px),560px)}
/* 0.3.1 (BACKLOG 19 and 21; admin's choice A, full blocks at every width): Today as blocks beside the card. The blocks keep
   the width they had (--blw); only the number of columns drops, and the card takes the room the columns leave (--pwA, both
   set when the card opens). (Written for 1024 px: with the new navigation the style sheet
   moves it to 840 px, where the card floats beside the list.) */
@media (min-width:1024px){
  .shell.pshown.tvb.blkA .blocks{grid-template-columns:repeat(auto-fill,min(var(--blw,250px),100%));justify-content:start}
  .shell.pshown.tvb.blkA,html.nav3[data-lay] .shell.pshown.tvb.blkA{--pw:var(--pwA,clamp(340px,calc(100vw - var(--sbw) - var(--fcol) - 520px),560px))}
}

.chip.more[hidden]{display:none} /* 0.3.1: when every chip fits on one row, no empty chip at its end (since 0.2.9) */
.chip.more[aria-expanded="true"]{color:var(--muted)}
.chip.more svg.ic{width:15px;height:15px;transition:transform .25s var(--ease)}
.chip.more[aria-expanded="true"] svg.ic{transform:rotate(180deg)}
/* a foldable opened (Viewport Segments): the card fills the right half, the list the left one */
@media (horizontal-viewport-segments:2){
  html.nav3 .shell.pshown .panel{position:fixed!important;inset:0 0 0 env(viewport-segment-left 1 0)!important;width:auto!important;max-height:none!important;border-radius:0!important}
  html.nav3 .shell.pshown .wrap{max-width:none;padding-right:calc(100vw - env(viewport-segment-right 0 0) + 16px)}
}
/* ===== 0.2.9 depth and colours (admin: "các lớp chưa hiện rõ là nằm chồng lên nhau ... chưa có độ nổi khối"; chose the
   paper stack: the upper layer is a sheet with a long soft shadow, the one under it recedes) and five colour sets in
   Settings, Appearance (admin: "nó có thể là tùy chọn trong settings ... cho tôi 5 phương án màu (cả màu cũ)").
   Each set gives the menu, the page and the card a colour of their own: Paper (the old one), Navy, Sage, Sky and sand,
   Teal. Dark menus (Navy, Teal) carry their own light text inside .sb. */
:root{--d-top:0 0 0 1px rgba(31,30,27,.07),0 2px 6px rgba(31,30,27,.06),0 28px 64px -20px rgba(31,30,27,.38);--d-lift:0 0 0 1px var(--line),0 1px 2px rgba(31,30,27,.05),0 6px 16px -10px rgba(31,30,27,.22);--side:#ECE8DF}
:root[data-theme="dark"]{--d-top:0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.4),0 32px 70px -18px rgba(0,0,0,.9);--d-lift:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.05),0 8px 18px -10px rgba(0,0,0,.8);--side:#080807}
.sb{background:var(--side)}
.tile,.kpi,.list,.box{box-shadow:var(--d-lift)}
.panel{box-shadow:var(--d-top)!important}
.shell.pshown .pscrim{background:rgba(31,30,27,.12)}
:root[data-theme="dark"] .shell.pshown .pscrim{background:rgba(0,0,0,.38)}
@media (min-width:1024px){.shell.pshown .sb{z-index:45}} /* the card dims the page, not the menu beside it */
/* 0.3.0 (admin: "hiệu ứng block được chọn vẫn nổi sáng hơn các block xung quanh sao mất rồi"): beside the card the page is no
   layer of its own, so the chosen row or block rises above the dim again */
html.nav3[data-lay="side"] .shell.pshown:not(.sbslide):not(.sbpeek) .mainwrap{z-index:auto}
/* the phone menu: the page is a sheet that steps back, rounded, with its shadow (.drshade) under it */
.drshade{display:none}
html.nav3[data-lay="stack"] .drshade{display:block;position:fixed;inset:0;z-index:30;pointer-events:none;border-radius:26px;box-shadow:var(--d-top);opacity:0;transform-origin:0 50%}
html.nav3[data-lay="stack"] .shell.drawer .drshade{opacity:1;transform:translateX(min(320px,calc(100vw - 64px))) scale(.9)}
html.nav3[data-lay="stack"] .shell.drawer .mainwrap{transform:translateX(min(320px,calc(100vw - 64px))) scale(.9);transform-origin:0 var(--dro,50vh);clip-path:inset(var(--drt,0px) 0 var(--drb,0px) 0 round 29px);box-shadow:none}
/* (admin: "nếu kéo qua mà lớp 2 thu nhỏ lại, thì sao cái nền không là màu của lớp 1 luôn") everything behind the page is the
   menu's layer: its colour fills the whole screen, above and below the sheet too, with no line at the menu's edge */
html.nav3[data-lay="stack"] .shell::before{content:"";position:fixed;inset:0;z-index:0;background:var(--side);pointer-events:none}
html.nav3[data-lay="stack"] .sb{border-right:0}
html.nav3[data-lay="stack"] .mainwrap{min-height:100vh;min-height:100dvh}
/* 0.3.1 (BACKLOG 22): the three moving parts keep their own layer at rest, so the hand-off from the movement to the resting
   style repaints nothing (the flash at the end of a slide on iPhone Safari) */
html.nav3[data-lay="stack"] .mainwrap,html.nav3[data-lay="stack"] .sb,html.nav3[data-lay="stack"] .drshade{will-change:transform}
/* the colour sets */
:root[data-pal="navy"]{--side:#16305A} :root[data-pal="navy"][data-theme="dark"]{--side:#0B1730}
:root[data-pal="teal"]{--side:#123F3C} :root[data-pal="teal"][data-theme="dark"]{--side:#082725}
:root[data-pal="navy"] .sb,:root[data-pal="teal"] .sb{--ink:#F2F5FA;--ink-2:#DCE3EE;--muted:#9FB0C8;--hover:rgba(255,255,255,.08);--sel:rgba(255,255,255,.15);--line:rgba(255,255,255,.13);--line-2:rgba(255,255,255,.22);color:var(--ink)}
:root[data-pal="navy"] .sb{--surface:#1F3C6C;--surface-2:#27497F;--accent-text:#BCD2F8;--accent-soft:#2B4B80}
:root[data-pal="navy"][data-theme="dark"] .sb{--surface:#152747;--surface-2:#1C3258;--accent-soft:#223A66}
:root[data-pal="teal"] .sb{--muted:#9DC4BE;--surface:#1A4F4B;--surface-2:#215A55;--accent-text:#A6E6DC;--accent-soft:#205A54}
:root[data-pal="teal"][data-theme="dark"] .sb{--surface:#10393A;--surface-2:#164543;--accent-soft:#174A46}
:root[data-pal="navy"] .sb .sb-brand b,:root[data-pal="teal"] .sb .sb-brand b{color:var(--accent-text)}
:root[data-pal="navy"][data-theme="dark"] .panel{background:#23262C}
:root[data-pal="teal"][data-theme="dark"] .panel{background:#23272A}
:root[data-pal="sage"]{--side:#DCE7DD;--bg:#FAF8F3} :root[data-pal="sage"][data-theme="dark"]{--side:#0F1C15;--bg:#141413}
:root[data-pal="sage"] .sb{--hover:rgba(30,70,45,.06);--sel:rgba(30,70,45,.11);--line:rgba(30,70,45,.13);--surface:#F4F8F4}
:root[data-pal="sage"][data-theme="dark"] .sb{--hover:rgba(160,230,180,.07);--sel:rgba(160,230,180,.12);--line:rgba(160,230,180,.12);--surface:#18291F}
:root[data-pal="sky"]{--side:#E0E7F1;--bg:#F6F0E4} :root[data-pal="sky"][data-theme="dark"]{--side:#0E141E;--bg:#17140F}
:root[data-pal="sky"] .sb{--hover:rgba(23,64,127,.06);--sel:rgba(23,64,127,.11);--line:rgba(23,64,127,.12);--surface:#F5F8FC}
:root[data-pal="sky"][data-theme="dark"] .sb{--hover:rgba(140,180,255,.07);--sel:rgba(140,180,255,.12);--line:rgba(140,180,255,.12);--surface:#172030}
:root[data-pal="sky"][data-theme="dark"] .panel{background:#262A31}
/* 0.2.9 layers with springs: ghosts of what closes, phone dialogs as sheets from the bottom (pull down to close) */
.mo-ghost{position:fixed;inset:0;z-index:89;pointer-events:none}

  html:not(.kb-open) .overlay:not(.pal-ov) > .dialog::before{top:9px}
}
/* 0.3.1 (BACKLOG 30, admin: "phía trên cùng của pop up có thanh rất nhỏ ngắn ... để người ta biết hướng kéo"; "Màu xám như
   iPhone"): every layer that can be dragged away shows a small grey bar on the side it leaves by: at the top of what goes
   down (dialogs and sheets, Search, the account sheet), at the bottom of what goes up (the notifications list on a phone),
   at the left edge of what goes sideways (the card; the page lying over a hidden sidebar). Only a sign: the layer can be

:root{--dbar:color-mix(in srgb,var(--ink) 22%,transparent)}

.acct-h{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.acct-h .av{width:36px;height:36px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font:600 calc(13px*var(--fz,1)) var(--sans);box-shadow:inset 0 0 0 1px var(--accent-line)}
.acct-h .who{display:flex;flex-direction:column;min-width:0}.acct-h .who b{font:600 calc(14px*var(--fz,1)) var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct-h .who span{font-size:calc(12px*var(--fz,1));color:var(--muted)}
.acct-sec{display:flex;align-items:center;gap:8px;margin:6px 12px 2px;padding-top:8px;border-top:1px solid var(--line);font:600 calc(11px*var(--fz,1)) var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.acct-test{font-style:normal;padding:1px 6px;border-radius:999px;background:var(--t-draft-bg);color:var(--t-draft-fg);letter-spacing:.04em}
.pop.acct .mi .pj{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font:700 calc(13px*var(--fz,1)) var(--sans)}
.pop.acct .mi{align-items:center}.pop.acct .mi>svg.ic:last-child{margin-left:auto}
.pop.acct [data-a="acct-sw"]>svg.ic:last-child{color:var(--muted);transition:transform .2s var(--ease)}.pop.acct [data-a="acct-sw"][aria-expanded="true"]>svg.ic:last-child{transform:rotate(180deg)}
.acct-list{margin:0 0 4px 22px;padding-left:8px;border-left:1px solid var(--line)}
.pop.acct .mi.acc .av{width:26px;height:26px;border-radius:999px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);font:600 calc(11px*var(--fz,1)) var(--sans);box-shadow:inset 0 0 0 1px var(--line-2)}
.pop.acct .mi.acc .av.add .ic{width:14px;height:14px;margin:0;color:var(--accent-text)}
.pop.acct .mi .pj.more{background:var(--surface-2);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--line-2)}.pop.acct .mi .pj .ic{width:14px;height:14px;margin:0;color:inherit}
.pop.acct .mi.on>svg.ic:last-child{margin-left:auto;align-self:center;color:var(--accent-text)}
</style>
