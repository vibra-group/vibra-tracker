<body>
<div id="app" aria-live="polite">
  <div class="wrap" style="max-width:960px;padding-top:40px">
    <!-- 0.2.2: something to read while the first data of a new device loads (later visits open at once) -->
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px">
      <h1 class="h1" style="margin:0">Today</h1>
      <span class="stale-pill" role="status"><i aria-hidden="true"></i>Loading your manuscripts…</span>
    </div>
    <p class="sub" style="margin:0 0 22px">The first opening on a device takes a few seconds. After that VIBRA opens at once with your last data and brings it up to date by itself.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:26px">
      <div class="skel" style="height:74px;border-radius:12px"></div><div class="skel" style="height:74px;border-radius:12px"></div><div class="skel" style="height:74px;border-radius:12px"></div>
      <div class="skel" style="height:74px;border-radius:12px"></div><div class="skel" style="height:74px;border-radius:12px"></div><div class="skel" style="height:74px;border-radius:12px"></div>
    </div>
    <div class="skel" style="height:72px;margin-bottom:12px;border-radius:10px"></div>
    <div class="skel" style="height:72px;margin-bottom:12px;border-radius:10px"></div>
    <div class="skel" style="height:72px;border-radius:10px"></div>
  </div>
</div>
<div id="layer"></div>
<script>
/* VIBRA Tracker 0.1 - client. Talks to Code.gs through google.script.run (see api()). */
(function () {
'use strict';
var S = { boot: null, view: 'today', who: 'all', q: '', sel: null, draft: null, hist: {}, pop: null, tour: -1, nf: null,
  cb: null, ed: null, tip: null, saving: false, fx: {}, confirmClose: false, err: null,
  rem: null, qu: null, fb: null, del: null, ned: null, ndel: null, dashF: null, dashAll: false, outAll: false, desk: null, deskBatch: '', deskReport: null, lk: ['', '', ''], painted: false, xl: {}, xlOpen: null, lst: 'all', keep: {} };
var TIER_LABEL = { due: 'Due', deadline: 'Deadline', action: 'Our move', chase: 'Chase journal', waiting: 'Waiting', drafting: 'Drafting', closed: 'Closed' };
var SECTIONS = [
  { id: 'dl', tiers: ['due', 'deadline'], title: 'Due and deadlines', hint: 'sorted by days left' },
  { id: 'action', tiers: ['action'], title: 'Our move', hint: 'internal review, ready to submit, forms' },
  { id: 'chase', tiers: ['chase'], title: 'Chase the journal', hint: 'no news for more than 90 days' },
  { id: 'waiting', tiers: ['waiting'], title: 'Waiting on the journal or editor', hint: 'nothing to do yet' },
  { id: 'drafting', tiers: ['drafting'], title: 'Drafting', hint: '' }];
var TILE_SEC = { due: 'dl', deadline: 'dl', action: 'action', chase: 'chase', waiting: 'waiting', drafting: 'drafting' };
var STATUS_ORDER = ['Drafting', 'Internal review', 'Ready to Submit', 'Submitted', 'Under Review', 'Accepted', 'Published', 'Rejected'];
var LABEL = { title: 'Title', type: 'Type', journal: 'Journal', status: 'Status', stage: 'Stage', people_json: 'Ball is with', lead: 'Lead',
  next_actions: 'Next actions', deadline: 'Deadline', submission_date: 'Submission date', ms_id: 'MS ID', doi: 'DOI', authors_json: 'Authors', impact_factor: 'Journal IF', first_author: 'First author', note: 'Note', created: 'Created', deleted: 'Deleted', restored: 'Restored' };
var EDITABLE = ['title', 'type', 'journal', 'status', 'stage', 'people_json', 'next_actions', 'deadline', 'submission_date', 'ms_id', 'doi', 'authors_json', 'impact_factor', 'first_author', 'preprint', 'links_json'];
LABEL.preprint = 'Preprint'; LABEL.links_json = 'Links'; // 0.2.5
var TIPS = {
  preprint: 'The preprint\'s ID or DOI, as the preprint server gives it (Preprints.org, medRxiv, Research Square, SSRN…). A DOI or a Preprints.org ID opens with Open. The AI fills it from the server\'s e-mail.',
  links: 'Tracking: the journal\'s page for the manuscript (one Track button). Steps: a link for one next action; name it in that action and it leaves when the step is done. Only you: a link that acts as you, kept in your settings, never in the shared Sheet. The AI adds links from quick updates.',
  names: 'Names are matched by fixed rules, never by AI: accents, punctuation and hyphens are ignored, initials stand for given names, and a Vietnamese family name may come first. A name that could be two people, or only looks like someone, waits here until you say who it is. Every change is logged in History and can be undone.',
  whose: 'Shows only the manuscripts where this person has the ball (has to act next). Choose Me for your own list, Everyone for the whole group. All manuscripts also counts the manuscripts a person is an author of.',
  whoseAll: 'Shows the manuscripts where this person has the ball or is one of the authors, however the name is written. Today and Pipeline count only who has the ball.',
  urgency: 'Set automatically. Due: a deadline within 7 days or overdue, or the journal sent it back to us and is waiting (stage Returned to authors). Deadline: a later deadline. Our move: the group must act (ready to submit, internal review, co-authors confirming, reviews back, a revision). Chase journal: at a journal with no news for over 90 days. Waiting: the journal or editor has it. Click a tile to jump to its list.',
  status: 'Where the manuscript is: Drafting, Internal review, Ready to Submit, Submitted, Under Review, Accepted, Published or Rejected. Published and Rejected close the manuscript.',
  stage: 'Only for Submitted and Under Review: where it stands at the journal, for example With editor, Review R1 or Revising. Returned to authors: the journal asked us for something (a checklist, forms, files, resume the submission); it then shows as Due until it is done. Authors confirming: co-authors still have to confirm on the journal site; it shows as Our move.',
  deadline: 'A real date set by the journal or by GV. Whoever has the ball sees it on Today and gets an alert 7 days and 1 day before.',
  ball: 'The people who must act next (not the authors). Click a tag to add a short note such as corr. or submitting, or to make it primary: the primary person gets the alerts. Click the box below to pick a member, or type any other name to add a guest tag (no notifications).',
  next: 'What has to happen next, as a numbered list. Press Enter and the next number appears; Enter on an empty number ends the list; Shift+Enter adds a line break.',
  authors: 'The author list in submission order; the first tag is the first author. Each author is one person in the Authors list, shown with the full name on file however it was written (point at a tag to see how it was written). A tag with ? is not settled yet: the admin confirms it in the AI desk. Click a tag to add a note, mark the corresponding author or move it.',
  note: 'Adds a dated line to this manuscript\'s history, visible to everyone. Use it for facts: a mail received, a decision, a file sent.',
  notif: 'Choose which events put a notification under your bell. They are yours only.',
  review: 'Changes made by others apply at once, as before. This list shows them (one line per save, with what changed) until you mark them reviewed; Undo puts a field back and History records that you undid it. Only the admin and the supervisor see this page; each keeps their own reviewed list.',
  todo: '“Ball with me” lines come by themselves: one for each open manuscript where you have the ball (its next step and its deadline). They leave when the step is done or the ball moves on; tick one to tell the AI the step is done. Your own lines: only you see them, kept with your settings, not in the shared Sheet. Remind me in a manuscript adds a line too; a date puts it in the calendar and under your bell that day.',
  roles: 'Admin: adds members, changes roles, the AI desk. Supervisor: everything an Editor does, plus deciding deletion requests, restoring deleted manuscripts and Changes to review (see and undo what others changed). Editor: creates and updates manuscripts. Viewer: reads and exports only. A member also needs the Google Sheet shared with them.',
  dashc: 'Choose which blocks you see, in which order, and whether the dashboard shows the whole group or only the manuscripts you are on. Saved for you only.',
  xl: 'Every cell this manuscript had in the Excel workbook (Manuscripts_tracker.xlsx) when the app was set up, kept read-only so nothing is lost. The fields above are the live ones.',
  lst: 'All: every manuscript ever tracked. In progress: something is still to do (an accepted paper with proofs pending counts here). Accepted, Published, Rejected: by status, kept for the record.',
  aroles: 'The corresponding author and the first author of the paper, from the author tags (click a tag to mark it corresponding) and the First author field. "Ball is with" is different: the person who must act next, which is often somebody else.',
  live: 'While the app is open (also in a background tab) it checks for news every minute: new items appear under the bell with a short message, and a soft sound plays when someone passes you the ball. Pop-up notifications from the browser are not possible here: Google runs these apps in a protected frame that blocks them. For alerts on your phone or computer, install the VIBRA app (Settings, Notifications).',
  remind: 'A private reminder, for you only. Pick a date and time: Google Calendar opens in a new tab with the event filled in and you press Save (or download an .ics file for Apple or Outlook). Your calendar sends the alert. Tick the box to also see it under the bell that day. No extra Google permission is needed.',
  calfile: 'One calendar file with the deadlines of every open manuscript where you are tagged (ball or author). Open it to import them into Google, Apple or Outlook calendar. It is a snapshot: download it again after deadlines change.',
  feed: 'A private calendar address that your calendar app subscribes to: the deadlines appear as all-day events and move by themselves when a deadline changes, with no file to download again. Google Calendar refreshes subscribed calendars on its own schedule, sometimes only once a day; Apple Calendar and Outlook let you choose how often. Keep the address to yourself: anyone who has it sees these deadlines (titles, journal, ball, next actions). Make a new link if it was shared by mistake: the old one stops at once. It gives no access to the app or the database.',
  mailrem: 'Your reminders are private: they are kept in your own Google account, not in the shared database, so they are not sent by e-mail. Add a reminder to your calendar with the calendar button and your calendar alerts you, by e-mail too if you set it so.',
  digest: 'A short e-mail every Monday at 07:00 (Vietnam time): the manuscripts that wait on you, what is due or overdue, deadlines in the next three weeks and journals to chase. It is sent from the admin\'s helper with the sender name VIBRA Tracker. The admin tries it alone first, then opens it to everyone; you can switch it off for yourself at any time.',
  dlalert: 'A notification under the bell (and on your phone if you paired the VIBRA app) 7 days and 1 day before a deadline, when you have the ball. Sent at 07:00 Vietnam time.',
  permweb: 'You sign in with Google on the group\'s own page. Google tells the app only your name and e-mail address; the app gets no permission on your Google account. Sign out on this device in Settings, General. You can also remove the sign-in in your Google account at any time.',
  perm: 'Google asked you for these two permissions the first time you opened the app. They cover only this database and your e-mail address. You can remove the access at any time in your Google account; the app then asks again next time.',
  requests: 'What you sent with Quick update or Feedback, and what happened to it. With the AI helper switched on, a quick update is applied within about a minute; anything that needs a closer look, and everything when the helper is off, is applied by the 06:00 check (Vietnam time).',
  pwa: 'The VIBRA app is a small page you install once (it lives on GitHub Pages and holds no group data). It opens this tracker, shows your own manuscripts when you are offline, and receives notifications. To pair a device, get a one-time code here and type it in the app. Turn notifications off in the app at any time.',
  audet: 'Affiliations, e-mails and ORCID of this manuscript\'s authors, filled in together. Type them, look up an ORCID, or paste a screenshot of the title page and the AI proposes them (the name rules decide who is who; nothing is saved until you press Save). They are kept once per person, so every manuscript of that author benefits. Each change is logged with your name and can be undone. Members fill in their own in Settings, General. Author sheet downloads an Excel file for the journal submission: the authors in order with numbered affiliations, e-mails and ORCID, and a title page; it holds personal details, so share it only for the submission.',
  auexp: 'An Excel file to fill in a journal submission quickly: every author in order with full name, given and family name, role (first, equal contribution, corresponding), numbered affiliations, e-mails and ORCID, plus a title page with the author line and affiliations. Details come from the Authors tab of the Sheet; anything missing is listed under To check. The file holds personal details: share it only for the submission.',
  att: 'Built from deadlines, journals silent for over 90 days, manuscripts ready but not yet submitted, and manuscripts where a guest holds the ball. Click a number to filter the list; the calendar button sets a private reminder.',
  strip: 'Days since the last recorded update of each open manuscript, grouped by status. A dot far to the right means nobody has logged news for a long time: a journal to chase or a draft that stalled. Hover or focus a dot for the title; click to open it. Manuscripts without any date are counted on the right.',
  turn: 'From the submission date to the latest recorded update (usually the decision or publication). Only manuscripts with both dates count, so treat it as a rough guide.',
  wk: 'Each bar counts the open manuscripts where the person is the primary ball holder, split by urgency. "Author on" counts open manuscripts where the person is in the author list.',
  desk: 'The morning routine pastes a JSON batch here. Rule: newer information wins, so a field a person edited after the evidence time is skipped and reported. Inbox and feedback items listed in the batch are closed and their senders notified.'
};
/* 0.2.0 onboarding (admin's request): a welcome page, then each step points at the real control on the page.
   sel: the first visible match is highlighted (desktop selector first, phone fallback after); open: the step needs a
   manuscript's details open (the tour opens the first one on Today, read only, and closes it afterwards). */
/* 0.2.1: What's new. Add a release at the top when members will see a difference (a feature, a change in how
   something works, a bug they may have met); internal fixes need none. Each member sees the card once per release
   (preference relSeen; the 0.2.0 tour stands for 0.2.0), never in a session that showed the tour; the bell keeps it. */
var RELEASES = [
  { v: '0.3.1', date: '2026-10-25', title: 'Close by hand, your photo, steadier blocks', items: [
    ['spark', 'One rule for closing by hand: what came in from the side goes back to the side, what rose from the bottom goes down. Search closes with a pull down, the notifications list with a swipe up. A small grey bar shows the way.'],
    ['desktop', 'On a laptop, a two-finger swipe on the trackpad moves the top layer: the card to the right, a dialog or Search down, and with the sidebar hidden the page off the sidebar and back (that also changes Keep the sidebar hidden). A mouse can press and drag them; its wheel only scrolls.'],
    ['user', 'Your Google photo on your round avatar, for everyone in the group. It comes when you sign in with Google (or Settings, Use my Google photo). Google\'s own rounded sign-in button.'],
    ['apps', 'Blocks beside the card keep their size and every line; only the number of columns changes, and the block you chose stays in sight, also when you close the card.'],
    ['sliders', 'The coloured notches for quick scrolling are on All manuscripts too, and on computers. The phone menu can be caught mid-way, without a stop or a flash, and the page no longer jumps when a card closes.'],
    ['bell2', 'Earlier notifications load by themselves when you reach the end of the list.']] },
  { v: '0.3.0', date: '2026-10-24', title: 'Answer a reminder, links that know their place, your to-do fills itself', items: [
    ['bell', 'A nudge or a deadline alert now opens a Reply sheet: say what happened in one line (any language, or dictate it) and the AI updates the manuscript; or press On it. Whoever nudged you sees your answer. On Android and on a computer the notification itself has Reply and On it.'],
    ['check', 'Everyone has a To-do now. "Ball with me" lines come by themselves for every manuscript where you have the ball (its next step, its deadline) and leave when the step is done or the ball moves on. Tick one and the AI marks the step done. Your own lines stay private, as before.'],
    ['link', 'Links know their place: the journal\'s tracking page is one Track button on the card and on its row or block; a link for a step shows on the next action that names it and leaves when that step is done; a personal link (only you) is kept in your own settings and nobody else sees it.'],
    ['apps', 'Smoother and quicker: the card slides in and out, the blocks settle while it closes, the chosen block stands out, the sidebar glides, every dialog and the notifications open faster, and the blocks have more room. Tap your name at the bottom of the menu to sign in with another account or sign out.']] },
  { v: '0.2.9', date: '2026-10-24', title: 'Layers you can feel, your own colours', items: [ // 0.2.9 ships with 0.2.8 as one update: one card for both
    ['apps', 'A manuscript\'s card grows out of the row or block you tapped and shrinks back into it when you close it. Nothing behind it flickers any more, and switching between List and Blocks leaves the top of the page still.'],
    ['phone', 'On a phone, swipe the card to the right to close it; it follows your finger. On a laptop a two-finger swipe to the right on the trackpad does the same. Back (the browser\'s, Android\'s, Alt + Left) and Esc close one layer at a time.'],
    ['phone', 'New navigation in layers: on a phone the menu lies under the page; tap the menu button or swipe right and the page steps aside, swipe it back. On an iPad or a narrow window the sidebar becomes a rail of icons (hover one to see its name); on a wide screen the card opens beside the list. The sidebar button slides the page in and out like a sheet of paper.', 'nav3'],
    ['sun', 'Your own colours: Settings, Appearance, Colours: Paper (as before), Navy, Sage, Sky and sand or Teal, in light and dark. The layers stand out: the card floats on a soft shadow and the page behind it steps back.'],
    ['spark', 'Dialogs and menus grow out of the button you pressed and go back into it. On a phone a dialog rises from the bottom; pull it down to close it. Search and Quick update sit one above the other at the bottom right, and the box you type in is ready at once.'],
    ['find', 'In Quick update, the Manuscript box is a search: type any word of the title, the journal, a person or the number. Whose work shows Everyone, Me and the person you chose, the others behind "more".'],
    ['bell2', 'Notifications open over a dimmed page, with "See earlier" and "Choose what notifies you" always at the bottom; on a phone the list grows with your notifications and a tap below it closes it.'],
    ['sliders', 'Calmer details: a larger VIBRA name, What\'s new opens one release at a time, slim scroll bars on Windows, and a new version moves in by itself.']] },
  { v: '0.2.7', date: '2026-10-24', title: 'Calmer phone screens, compact notifications', items: [
    ['bell2', 'Notifications stay compact: the latest few, scrolling inside the list. "See earlier notifications" brings older ones when you want them, and a soft blur around the list sets it apart.'],
    ['phone', 'On a phone, Quick update and Search float at the bottom everywhere, also over an open manuscript, where Quick update becomes a round ⚡ (press and hold to see its name).'],
    ['plus', 'New manuscript at the top of the phone screen; the Search and ⚡ buttons up there are gone (both float at the bottom).'],
    ['sliders', 'Today on a phone: as you scroll, coloured notches appear at the right edge, one per manuscript. Slide a finger along them to jump between Due, Deadline, Our move, Chase journal, Waiting and Drafting.'],
    ['restore', 'Easier on the battery: the app checks for news every 20 seconds while you use it, every minute after 5 idle minutes. What\'s new scrolls inside its own frame.']] },
  { v: '0.2.6', date: '2026-10-23', title: 'Larger text if you like, smoother quick updates', items: [
    ['bolt', 'Fixed: a quick update with a screenshot could be read before its screenshot arrived ("no visible screenshots") and then read a second time. Each update is now read once, with its screenshots.'],
    ['phone', 'On a phone the keyboard no longer covers the text box: the dialog fits above it while you type.'],
    ['sheet', 'A small Paste button inside the text box pastes the text or screenshot you copied.'],
    ['restore', 'The label at the top no longer counts seconds; a soft sheen shows the AI is at work, like Updating.'],
    ['sliders', 'Text size: Small, Medium or Large, in Settings, Appearance. Kept for your account on every device.']] },
  { v: '0.2.5', date: '2026-10-23', title: 'Undo in one go, faster quick updates, links', items: [
    ['restore', 'Undo a whole update with one button: right after a quick update, in Updates and feedback, in History and in Changes to review. What was undone leaves History, and notifications about it are taken back.'],
    ['bolt', 'Quick updates with a screenshot are faster: one trip to the server, and the label at the top shows the AI at work. Screenshots are deleted as soon as the AI has read them.'],
    ['list', 'Under Today: what others changed since your last visit, instead of the counts the tiles already show.'],
    ['people', 'Drag an author to reorder the list (on a phone: press and hold, then drag).'],
    ['link', 'Links from the publisher (invited submission, revision and reviews, proofs) sit under Next actions, and a Preprint ID or DOI in Title, journal, IF and IDs. The AI fills both from quick updates.'],
    ['phone', 'The sidebar scrolls on a phone held sideways; "Updating" now floats so you see it anywhere; the phone\'s top bar shows a larger VIBRA.']] },
  { v: '0.2.4', date: '2026-10-23', title: 'Smoother, clearer at night, a new icon', items: [
    ['list', 'Closing a manuscript card is smooth now: the card slides away and the blocks glide back into place.'],
    ['sidebar', 'Pinned, Waiting on me and Recent in the sidebar can be folded shut (click the heading); each person\'s choice is kept.'],
    ['moon', 'Dark mode: darker cards and popups, clearer text, buttons and tags.'],
    ['phone', 'A new VIBRA icon for the installed app. On a phone it may only change after removing and adding VIBRA again.'],
    ['gear', 'Fixed: with the sidebar hidden, the Settings sections were squeezed; the tour\'s Next button no longer slips out of its card.']] },
  { v: '0.2.3', date: '2026-10-23', title: 'Easier details, nudges, a short tour', items: [
    ['list', 'On a computer, click a manuscript to open its card; click it again, or any empty space, to close it; click another title to switch. With Today as blocks, the blocks move aside so none is hidden.'],
    ['bell', 'Nudges: the admin can nudge whoever has the ball. You see it in the bell, on your phone or computer where notifications are on, and as a card when VIBRA is open. The app icon shows how many things are unread.'],
    ['people', 'A Supervisor role: decides deletion requests, restores deleted manuscripts and reviews what others changed.'],
    ['desktop', 'New members are helped to install VIBRA and turn on notifications first; the tour now also shows author details, working offline and Send feedback.']] },
  { v: '0.2.2', date: '2026-10-23', title: 'Opens faster, works offline', items: [
    ['bolt', 'VIBRA opens at once with the data from your last visit, even right after an update; the latest data follows a few seconds later (the blue "Updating" label). The server also answers faster.'],
    ['restore', 'No connection? You can still read everything. What you change is kept on this device until you are back online; then press Save. Nothing is sent by itself, and nothing overwrites a colleague\'s newer change.'],
    ['apps', 'Today can be shown as blocks instead of a list: the switch is at the top right, and your choice is kept. Each block has a bar showing how far the manuscript has come.'],
    ['list', 'On a computer, a manuscript\'s details open as a card on the right: the list stays readable behind it, so you can click another title to switch.'],
    ['down', 'Author sheet for submission now sits next to Author details, and inside it: fill in the details, then download.']] },
  { v: '0.2.1', date: '2026-10-23', title: 'Feedback and author details', go: ['general', 'Fill in my details'], items: [
    ['chat2', 'Send feedback now sits in the sidebar (on a phone: the speech bubble at the top) while we test the app. A bug report also sends the screen and device to help fix it; an idea sends nothing extra.'],
    ['people', 'Author details, in each manuscript: fill in the authors\' affiliations, e-mails and ORCID together. Look up an ORCID, or paste a screenshot of the title page and the AI proposes the details; you check and save.'],
    ['user', 'My details: add your own affiliation, e-mail and ORCID once (Settings, General); they serve every manuscript you are on.'],
    ['spark', 'A quick update with a title page fills missing author details by itself, never overwriting what is there.'],
    ['trash', 'Screenshots sent with a quick update or feedback are deleted after 10 days.']] },
  { v: '0.2.0', date: '2026-10-23', title: 'One app for everyone', items: [
    ['apps', 'One address for everyone: vibra-group.github.io/vibra-tracker/app. Install it with Get the app, beside your name.'],
    ['phone', 'On an iPhone, sign in with a code made on your computer (Settings, General).'],

/* ---------- 0.3.0 (BACKLOG 13): links of three kinds. The tracking link (the journal's page for the manuscript) is one

   leaves for the earlier links when that step is done (admin's choice: "Tự theo tên"); personal links live in the

function linkNamed(label, text) {
