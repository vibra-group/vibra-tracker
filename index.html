<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIBRA Tracker</title>
<meta name="description" content="The VIBRA research group's manuscript tracker: open it, get notifications, read your manuscripts offline.">
<meta name="theme-color" content="#F1EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1E1D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VIBRA">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{--bg:#F8F6F1;--side:#F1EEE6;--surface:#FFFFFF;--surface-2:#F3F0E9;--line:rgba(31,30,29,.10);--ink:#1F1E1D;--ink-2:#3D3B37;--muted:#6F6B63;
  --accent:#17407F;--accent-ink:#FFFFFF;--accent-soft:#E6ECF5;--accent-text:#17407F;--hover:rgba(31,30,29,.05);
  --due:#B42318;--due-bg:#FBE6E2;--soon:#8A4B0F;--soon-bg:#F8EBD3;--ok:#1D6B44;--ok-bg:#DFF0E4;--r:16px;--r-sm:10px;
  --shadow:0 1px 2px rgba(31,30,29,.04),0 6px 20px -12px rgba(31,30,29,.14);
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--side:#1F1E1D;--surface:#2E2E2B;--surface-2:#34342F;--line:rgba(255,255,255,.09);--ink:#ECEAE4;--ink-2:#CFCCC4;--muted:#A29E94;
  --accent:#4A78C2;--accent-soft:#263247;--accent-text:#A9C1EA;--hover:rgba(255,255,255,.05);
  --due:#F5A597;--due-bg:#3B201C;--soon:#F0C27A;--soon-bg:#382B17;--ok:#86D4A6;--ok-bg:#1B3226;--shadow:0 1px 2px rgba(0,0,0,.2);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:22px 18px 44px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;padding:2px 2px 6px}
header img{width:32px;height:32px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)}
header b{font:700 17px var(--sans);letter-spacing:.07em;color:var(--accent-text)}
header span{color:var(--muted);font-weight:500}
.net{margin-left:auto;font:500 11.5px var(--sans);font-style:normal;padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.net.off{background:var(--soon-bg);color:var(--soon)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:600 16px/1.3 var(--sans)}
.hero{background:none;border:0;box-shadow:none;padding:10px 2px 6px}
.hero h1{margin:0;font:500 34px/1.12 var(--serif);letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:550 15px var(--sans);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-text)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{margin:0;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;background:var(--surface-2)}
.msg.err{background:var(--due-bg);color:var(--due)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
label.lbl{font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input.code{width:100%;min-height:52px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:600 24px var(--mono);letter-spacing:.14em;text-transform:uppercase}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
ul.list li:first-child{border-top:0;padding-top:2px}
.t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font:600 11.5px var(--sans);background:var(--accent-soft);color:var(--accent-text);margin-right:6px}
.chip.due{background:var(--due-bg);color:var(--due)}
.chip.soon{background:var(--soon-bg);color:var(--soon)}
.next{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
details.next summary{cursor:pointer;color:var(--accent-text);font-size:13px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px}
[hidden]{display:none!important}
/* the installed app: the tracker itself fills the window */
.app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
.app iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .3s ease}
.app.ready iframe{opacity:1}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);transition:opacity .3s ease}
.app.ready .splash{opacity:0;pointer-events:none}
.splash img{width:64px;height:64px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--line),0 12px 30px -16px rgba(31,30,29,.35)}
.splash .name{font:500 26px/1.1 var(--serif)}
.splash .name span{color:var(--muted)}
.splash .bar{width:160px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.splash p{margin:0;max-width:420px;color:var(--ink-2);font-size:14px}
.splash.stuck .bar{display:none}
@media (prefers-reduced-motion:reduce){.splash .bar i{animation:none;width:100%}.app iframe,.splash{transition:none}}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <iframe id="tracker" title="VIBRA Tracker" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="" width="64" height="64">
    <div class="name">VIBRA <span>Tracker</span></div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p id="splash-msg">Opening your manuscripts…</p>
    <div class="row" id="splash-act" hidden style="justify-content:center">
      <button class="btn primary small" id="sp-browser" type="button">Open in the browser</button>
      <button class="btn small" id="sp-retry" type="button">Try again</button>
      <button class="btn ghost small" id="sp-home" type="button">App page</button>
    </div>
  </div>
</div>

<div class="wrap" id="home">
  <header><img src="icons/icon-192.png" alt="" width="32" height="32"><b>VIBRA</b><span>Tracker</span><em class="net" id="net" role="status">Online</em></header>

  <section class="card hero">
    <h1>The group's manuscripts</h1>
    <p>Who has the ball, what is due, what happened.</p>
    <div class="row"><a class="btn primary" id="open" href="#" rel="noopener">Open the tracker</a></div>
    <p class="hint" id="open-hint"></p>
  </section>

  <section class="card" id="install" hidden>
    <h2>Install VIBRA</h2>
    <div id="install-body"></div>
    <div class="row"><button class="btn small" id="install-btn" type="button" hidden>Install VIBRA</button></div>
  </section>

  <section class="card" id="notif" aria-live="polite">
    <h2>Notifications</h2>
    <div id="notif-body"></div>
  </section>

  <section class="card" id="mine" hidden>
    <div class="row" style="justify-content:space-between"><h2>Your manuscripts</h2><button class="btn small" id="refresh" type="button">Refresh</button></div>
    <p class="hint" id="mine-asof"></p>
    <ul class="list" id="mine-list"></ul>
  </section>

  <section class="card" id="news" hidden>
    <h2>Recent news</h2>
    <ul class="list" id="news-list"></ul>
  </section>

  <footer id="foot"></footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
