<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIBRA Tracker</title>
<meta name="description" content="The VIBRA research group's manuscript tracker: open it, get notifications, read your manuscripts offline.">
<meta name="theme-color" content="#17407F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VIBRA">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{--bg:#F1F2F4;--surface:#FFFFFF;--surface-2:#F6F7F9;--line:rgba(16,24,40,.09);--ink:#0F1420;--ink-2:#3B4352;--muted:#626B7A;--accent:#17407F;--accent-ink:#FFFFFF;--accent-soft:#E7EDF6;--accent-text:#17407F;
  --due:#B42318;--due-bg:#FEE4E2;--soon:#93370D;--soon-bg:#FEF0C7;--ok:#05603A;--ok-bg:#D1FADF;--r:14px;--r-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1116;--surface:#151920;--surface-2:#1B2029;--line:#252B35;--ink:#ECEDEF;--ink-2:#C5C9D0;--muted:#979CA6;--accent:#3D6CB6;--accent-soft:#1B2840;--accent-text:#9DB9E8;
  --due:#FDA29B;--due-bg:#3A1714;--soon:#FEC84B;--soon-bg:#33240B;--ok:#6CE9A6;--ok-bg:#0B2B1D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px;padding:6px 2px}
header img{width:36px;height:36px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
header b{font:700 19px var(--sans);letter-spacing:.06em;color:var(--accent-text)}
header span{color:var(--muted);font-weight:500}
.net{margin-left:auto;font:500 11.5px var(--sans);padding:3px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.net.off{background:var(--soon-bg);color:var(--soon)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:650 16px/1.3 var(--sans)}
.hero{padding:22px 18px}
.hero h1{margin:0;font:700 26px/1.15 var(--sans);letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--sans);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -10px rgba(23,64,127,.7)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{margin:0;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;background:var(--surface-2)}
.msg.err{background:var(--due-bg);color:var(--due)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
label.lbl{font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input.code{width:100%;min-height:52px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font:600 24px var(--mono);letter-spacing:.14em;text-transform:uppercase}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
ul.list li:first-child{border-top:0;padding-top:2px}
.t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font:600 11.5px var(--sans);background:var(--accent-soft);color:var(--accent-text);margin-right:6px}
.chip.due{background:var(--due-bg);color:var(--due)}
.chip.soon{background:var(--soon-bg);color:var(--soon)}
.next{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
details.next summary{cursor:pointer;color:var(--accent-text);font-size:13px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icons/icon-192.png" alt="" width="36" height="36"><b>VIBRA</b><span>Tracker</span><em class="net" id="net" role="status">Online</em></header>

  <section class="card hero">
    <h1>VIBRA Tracker</h1>
    <p>The group's manuscripts: who has the ball, what is due, what happened.</p>
    <div class="row"><a class="btn primary" id="open" href="#" rel="noopener">Open the tracker</a></div>
    <p class="hint" id="open-hint"></p>
  </section>

  <section class="card" id="install" hidden>
    <h2>Install VIBRA</h2>
    <div id="install-body"></div>
    <div class="row"><button class="btn small" id="install-btn" type="button" hidden>Install VIBRA</button></div>
  </section>

  <section class="card" id="notif" aria-live="polite">
    <h2>Notifications</h2>
    <div id="notif-body"></div>
  </section>

  <section class="card" id="mine" hidden>
    <div class="row" style="justify-content:space-between"><h2>Your manuscripts</h2><button class="btn small" id="refresh" type="button">Refresh</button></div>
    <p class="hint" id="mine-asof"></p>
    <ul class="list" id="mine-list"></ul>
  </section>

  <section class="card" id="news" hidden>
    <h2>Recent news</h2>
    <ul class="list" id="news-list"></ul>
  </section>

  <footer id="foot"></footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
